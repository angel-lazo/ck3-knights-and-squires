l_english:
 kns_manage_imperial_guard_decision:0 "Manage Imperial Guard"
 kns_manage_imperial_guard_decision_desc:0 "Appoint up to five unlanded [kns_knights|E] as your [kns_imperial_guard|E], one each for axe, hammer, sword, spear, and mace. Each appointment costs 1500 gold and gifts that post's illustrious weapon and plate. Dress them from every war harness the game knows."
 kns_manage_imperial_guard_decision_tooltip:0 "Opens the Imperial Guard window"
 kns_manage_imperial_guard_decision_confirm:0 "Manage Imperial Guard"
 kns_appoint_imperial_guard_interaction:0 "Appoint Imperial Guard"
 kns_appoint_imperial_guard_interaction_desc:0 "Appoint [recipient.GetShortUIName] to the first vacant [kns_imperial_guard|E] post (axe, then hammer, sword, spear, mace). Costs 1500 gold and gifts that post's illustrious weapon and plate."
 kns_appoint_imperial_guard:0 "Appoint Imperial Guard"
 kns_appoint_imperial_guard_toast:0 "Imperial Guard Appointed"
 kns_appoint_imperial_guard_toast.tt:0 "They are sworn to your person and fitted with imperial steel."
