l_english:
 kns_manage_imperial_guard_decision:0 "Manage Imperial Guard"
 kns_manage_imperial_guard_decision_desc:0 "Appoint up to five [kns_knights|E] as your [kns_imperial_guard|E], one each for axe, hammer, sword, spear, and mace. Hire from your court or from knights of rulers in your domain. Each new appointment costs 1500 gold and binds that post's illustrious weapon and plate. A bound Accolade post is replaced, not dismissed. The steel stays with the post."
 kns_manage_imperial_guard_decision_tooltip:0 "Opens the Imperial Guard window"
 kns_manage_imperial_guard_decision_confirm:0 "Manage Imperial Guard"
 kns_appoint_imperial_guard_interaction:0 "Appoint Imperial Guard"
 kns_appoint_imperial_guard_interaction_desc:0 "Appoint [recipient.GetShortUIName] to the first vacant [kns_imperial_guard|E] post (axe, then hammer, sword, spear, mace). Costs 1500 gold and binds that post's illustrious weapon and plate. Unlanded knights join your court."
 kns_appoint_imperial_guard:0 "Appoint Imperial Guard"
 kns_appoint_imperial_guard_toast:0 "Imperial Guard Appointed"
 kns_appoint_imperial_guard_toast.tt:0 "They are sworn to your person and fitted with imperial steel."
 kns_dismiss_imperial_guard_interaction:0 "Dismiss Imperial Guard"
 kns_dismiss_imperial_guard_interaction_desc:0 "Release [recipient.GetShortUIName] from your [kns_imperial_guard|E]. The imperial weapon and plate stay with the post."
 kns_dismiss_imperial_guard:0 "Dismiss Imperial Guard"
 kns_dismiss_imperial_guard_toast:0 "Imperial Guard Dismissed"
 kns_dismiss_imperial_guard_toast.tt:0 "They are released from your [kns_imperial_guard|E]. The steel remains with the post."
 kns_attire_imperial_guard_interaction:0 "Attire Imperial Guard"
 kns_attire_imperial_guard_interaction_desc:0 "Choose the war harness [recipient.GetShortUIName] wears as your [kns_imperial_guard|E]."
 kns_attire_imperial_guard:0 "Attire Imperial Guard"
 kns_imperial_guard_kit_tt:0 "They receive this post's illustrious weapon and plate, or inherit steel already bound to it. New appointments cost 1500 gold."
 kns_imperial_guard_slot_tt:0 "Has a free Imperial Guard post (max 5, one of each weapon)"
 kns_imperial_guard_unlanded_tt:0 "Is unlanded, or a baron knight in your domain"
 kns_imperial_guard_courtier_tt:0 "Is a knight at your court or in your domain"
 kns_imperial_guard_knight_tt:0 "Is a [kns_knight|E] or a knight of a ruler in your domain"
 kns_art_imperial_guard_sword:0 "Imperial Guard Sword"
 kns_art_imperial_guard_axe:0 "Imperial Guard Axe"
 kns_art_imperial_guard_hammer:0 "Imperial Guard Hammer"
 kns_art_imperial_guard_mace:0 "Imperial Guard Mace"
 kns_art_imperial_guard_spear:0 "Imperial Guard Spear"
 kns_art_imperial_guard_weapon_desc:0 "Steel paid from the imperial purse for a sworn guard. It is bound to the post: successors inherit it, and it cannot be broken."
 kns_art_imperial_guard_plate:0 "Imperial Guard Plate"
 kns_art_imperial_guard_axe_armor:0 "Imperial Guard Axe's Armor"
 kns_art_imperial_guard_hammer_armor:0 "Imperial Guard Hammer's Armor"
 kns_art_imperial_guard_sword_armor:0 "Imperial Guard Sword's Armor"
 kns_art_imperial_guard_spear_armor:0 "Imperial Guard Spear's Armor"
 kns_art_imperial_guard_mace_armor:0 "Imperial Guard Mace's Armor"
 kns_art_imperial_guard_armor_desc:0 "Plate paid from the imperial purse for a sworn guard. It is bound to the post: successors inherit it, and it cannot be broken."
 kns_ig_window_title:0 "Imperial Guard"
 kns_ig_window_quota:0 "Guards [GetPlayer.MakeScope.Var('kns_ig_guard_count').GetValue|0] / 5"
 kns_ig_window_kit_cost:0 "Click a vacant post to hire. Appointment costs 1500 gold and binds that post's weapon and plate. Bound posts use Replace (no gold): the same steel is inherited. Bind Accolade needs a free Accolade slot — retire one first."
 kns_ig_window_unbound:0 "Vacant Accolade"
 kns_ig_hall_title_fallback:0 "[CHARACTER.GetShortUINameNoTooltip]"
 kns_ig_window_bind:0 "Bind Accolade"
 kns_ig_window_bind_tt:0 "Requires a free Accolade slot. First you choose a title for Manage Imperial Guard and as their nickname, then Accolade creation for attributes. Rank 3 is granted when it is founded."
 kns_ig_window_rename:0 "Rename"
 kns_ig_window_rename_tt:0 "Choose a new title for Manage Imperial Guard. Their bound weapon and plate are renamed to match. Their nickname is not changed."
 kns_ig_bind_need_slot_tt:0 "Retire an Accolade first to free a slot"
 kns_ig_bind_toast:0 "Found an Accolade"
 kns_ig_bind_toast.tt:0 "Choose any attributes for this Imperial Guard. Rank 3 follows when the Accolade is founded."
 kns_ig_rename_toast:0 "Title Changed"
 kns_ig_rename_toast.tt:0 "The hall title, bound weapon, and plate are renamed. Their nickname is unchanged."
 kns_ig_acc_pick_fallback:0 "Unknown Title"
 kns_ig_accolade.0001.t:0 "Accolade Title"
 kns_ig_accolade.0001.t_rename:0 "Rename Guard Title"
 kns_ig_accolade.0001.desc:0 "Choose a title for the Accolade of [kns_ig_named_knight.GetShortUIName]. Manage Imperial Guard will show this name, it becomes their nickname, and it is given to their bound weapon and plate, replacing any they already have. The Accolade window may still show a different one.\n\nRefresh the list if none of these fit."
 kns_ig_accolade.0001.desc_rename:0 "Choose a new hall title for [kns_ig_named_knight.GetShortUIName]. Their bound weapon and plate are renamed to match. Their nickname is not changed.\n\nRefresh the list if none of these fit."
 kns_ig_accolade.0001.a:0 "[kns_ig_named_knight.Custom('KnsIgAccPick1')]"
 kns_ig_accolade.0001.b:0 "[kns_ig_named_knight.Custom('KnsIgAccPick2')]"
 kns_ig_accolade.0001.c:0 "[kns_ig_named_knight.Custom('KnsIgAccPick3')]"
 kns_ig_accolade.0001.d:0 "[kns_ig_named_knight.Custom('KnsIgAccPick4')]"
 kns_ig_accolade.0001.e:0 "Refresh names"
 kns_ig_accolade.0001.f:0 "Cancel"
 kns_ig_kit.0001.t:0 "Imperial Steel Returned"
 kns_ig_kit.0001.desc:0 "[kns_ig_holder.GetShortUIName] has returned the imperial weapon and plate to [kns_ig_guard.GetShortUIName]."
 kns_ig_kit.0001.a:0 "As it should be."
 kns_ig_kit.0002.t:0 "Steel of the Guard"
 kns_ig_kit.0002.desc:0 "[kns_ig_holder.GetShortUIName] will not yield the imperial weapon and plate. [kns_ig_guard.GetShortUIName] fights to the death to retrieve them."
 kns_ig_kit.0002.a:0 "To the death."
