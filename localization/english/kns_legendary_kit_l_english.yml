l_english:
 kns_art_sword_excalibur:0 "Excalibur"
 kns_art_sword_excalibur_desc:0 "The sword drawn from the stone, said to choose only a king of arms. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_durandal:0 "Durandal"
 kns_art_sword_durandal_desc:0 "Roland's unbreakable blade, whose steel remembers Roncevaux. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_joyeuse:0 "Joyeuse"
 kns_art_sword_joyeuse_desc:0 "The coronation sword of Charlemagne, bright as a feast-day. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_tizona:0 "Tizona"
 kns_art_sword_tizona_desc:0 "El Cid's red sword, feared from Valencia to the mountain passes. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_colada:0 "Colada"
 kns_art_sword_colada_desc:0 "The Cid's second blade, keen enough to shame a king's gift. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_curtana:0 "Curtana"
 kns_art_sword_curtana_desc:0 "The Sword of Mercy, blunted at the tip yet terrible in a true hand. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_hauteclere:0 "Hauteclere"
 kns_art_sword_hauteclere_desc:0 "Olivier's shining sword, sister in fame to Durandal. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_almace:0 "Almace"
 kns_art_sword_almace_desc:0 "Turpin's bishop-blade, blessed and blooded in the same hour. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_clarent:0 "Clarent"
 kns_art_sword_clarent_desc:0 "Arthur's sword of peace, later stained by a kinsman's treason. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_galatine:0 "Galatine"
 kns_art_sword_galatine_desc:0 "Gawain's sun-sword, strongest at noon. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_arondight:0 "Arondight"
 kns_art_sword_arondight_desc:0 "Lancelot's blade, as famed as the knight who bore it. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_coreiseuse:0 "Coreiseuse"
 kns_art_sword_coreiseuse_desc:0 "King Ban's wrathful sword, named for the anger in its edge. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_murgleis:0 "Murgleis"
 kns_art_sword_murgleis_desc:0 "Ganelon's treacherous steel, beautiful and accursed. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_nagelring:0 "Nagelring"
 kns_art_sword_nagelring_desc:0 "Dietrich's nail-ringed sword from the German songs. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_gram:0 "Gram"
 kns_art_sword_gram_desc:0 "Sigurd's sword, the blade that split the anvil. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_balmung:0 "Balmung"
 kns_art_sword_balmung_desc:0 "The Nibelung sword, heavy with dragon-gold and doom. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_mimung:0 "Mimung"
 kns_art_sword_mimung_desc:0 "Wieland's masterpiece, forged for a hero's son. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_tyrfing:0 "Tyrfing"
 kns_art_sword_tyrfing_desc:0 "The dwarf-forged sword that must kill whenever it is drawn. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_skofnung:0 "Skofnung"
 kns_art_sword_skofnung_desc:0 "Hrolf Kraki's barrow-sword, said to hold the souls of twelve berserks. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_hrunting:0 "Hrunting"
 kns_art_sword_hrunting_desc:0 "Unferth's loan-sword, proven in the mere against Grendel's dam. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_naegling:0 "Naegling"
 kns_art_sword_naegling_desc:0 "Beowulf's last blade, which broke in the dragon's fire. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_caladbolg:0 "Caladbolg"
 kns_art_sword_caladbolg_desc:0 "Fergus mac Roich's rainbow-sword, that could cut the tops from hills. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_fragarach:0 "Fragarach"
 kns_art_sword_fragarach_desc:0 "The Answerer of the Tuatha, which no armor may refuse. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_crocea_mors:0 "Crocea Mors"
 kns_art_sword_crocea_mors_desc:0 "Caesar's yellow death, sung of in British chronicle. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_ascalon_blade:0 "Ascalon"
 kns_art_sword_ascalon_blade_desc:0 "The steel of Saint George, named for the city and the dragon. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_zulfiqar:0 "Zulfiqar"
 kns_art_sword_zulfiqar_desc:0 "The forked sword of Ali, split like lightning. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_wallace_blade:0 "The Wallace Sword"
 kns_art_sword_wallace_blade_desc:0 "A two-handed Scottish greatsword of grim repute. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_attila_sword:0 "The Sword of Attila"
 kns_art_sword_attila_sword_desc:0 "Called the Sword of Mars by those who paid tribute. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_goujian:0 "The Sword of Goujian"
 kns_art_sword_goujian_desc:0 "An ancient king's blade that does not stain. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_sword_precieuse:0 "Precieuse"
 kns_art_sword_precieuse_desc:0 "Baligant's pagan treasure-sword from the Song of Roland. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_olaf_axe:0 "The Axe of Saint Olaf"
 kns_art_axe_olaf_axe_desc:0 "The holy axe that hewed a kingdom into Christendom. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_boru_axe:0 "Brian Boru's Axe"
 kns_art_axe_boru_axe_desc:0 "The high king's wood-cleaver, wet at Clontarf. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_clovis_francisca:0 "The Francisca of Clovis"
 kns_art_axe_clovis_francisca_desc:0 "The throwing-axe that made the Franks masters of Gaul. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_skeggox:0 "Skeggox"
 kns_art_axe_skeggox_desc:0 "A bearded northern axe, hooked to pull a shield aside. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_hel_bili:0 "Hel-Billi"
 kns_art_axe_hel_bili_desc:0 "A long-hafted Dane axe named for the road to Hel. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_widow_hewer:0 "Widow-Hewer"
 kns_art_axe_widow_hewer_desc:0 "So called after a siege where no husband came home. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_ragnar_axe:0 "Lodbrok's Axe"
 kns_art_axe_ragnar_axe_desc:0 "A sea-king's boarding axe, notched on English oak and bone. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_harold_axe:0 "The Huscarl's Due"
 kns_art_axe_harold_axe_desc:0 "The great Dane axe of Stamford and Senlac. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_perun_axe:0 "Perun's Tooth"
 kns_art_axe_perun_axe_desc:0 "A Slavic thunder-axe, wedge-shaped like a stormbolt. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_forseti_axe:0 "Forseti's Edge"
 kns_art_axe_forseti_axe_desc:0 "Named for the god who judges, and used to end arguments. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_cnut_axe:0 "Cnut's Tide-Axe"
 kns_art_axe_cnut_axe_desc:0 "Said to have been wet in the North Sea and in blood alike. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_varangian_axe:0 "The Varangian"
 kns_art_axe_varangian_axe_desc:0 "A two-handed axe of the Emperor's northern guard. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_godwin_axe:0 "Godwin's Crook"
 kns_art_axe_godwin_axe_desc:0 "A bearded axe used as much to hook riders as to kill them. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_ulfr_axe:0 "Ulfberht's Cousin"
 kns_art_axe_ulfr_axe_desc:0 "Not a sword, but steel of the same proud stamp. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_hewer_of_rings:0 "Hewer of Rings"
 kns_art_axe_hewer_of_rings_desc:0 "Named for the way it opens mail as a man opens a purse. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_winter_bit:0 "Winter-Bit"
 kns_art_axe_winter_bit_desc:0 "An axe that never rusts, cold as a January ford. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_boar_tusk:0 "Boar-Tusk"
 kns_art_axe_boar_tusk_desc:0 "A short axe with a curved beard like a hunting hog. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_oakenshame:0 "Oakenshame"
 kns_art_axe_oakenshame_desc:0 "It has split more shield-linden than timber. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_red_helve:0 "Red-Helve"
 kns_art_axe_red_helve_desc:0 "The haft is dark with old handling and older stains. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_grave_wedge:0 "Grave-Wedge"
 kns_art_axe_grave_wedge_desc:0 "A burying axe: it sends men into the earth. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_crow_beak:0 "Crow-Beak"
 kns_art_axe_crow_beak_desc:0 "Hooked and hungry, made to find the gap in a helm. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_thingstead:0 "Thingstead"
 kns_art_axe_thingstead_desc:0 "Named because it settled a feud the law could not. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_sail_ripper:0 "Sail-Ripper"
 kns_art_axe_sail_ripper_desc:0 "A boarding axe that has cut more rope than firewood. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_monk_maker:0 "Monk-Maker"
 kns_art_axe_monk_maker_desc:0 "A grim joke: it has tonsured more than one enemy. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_iron_crescent:0 "Iron Crescent"
 kns_art_axe_iron_crescent_desc:0 "A crescent beard that catches a blade and keeps it. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_blood_adze:0 "Blood-Adze"
 kns_art_axe_blood_adze_desc:0 "Shaped like a carpenter's tool, used on living oak. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_night_cleaver:0 "Night-Cleaver"
 kns_art_axe_night_cleaver_desc:0 "Carried in the dark raids of the Irish Sea. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_wolf_jaw:0 "Wolf-Jaw"
 kns_art_axe_wolf_jaw_desc:0 "Two bits, like open fangs, on a short haft. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_stave_breaker:0 "Stave-Breaker"
 kns_art_axe_stave_breaker_desc:0 "Famous for shattering spear-shafts at the first blow. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_axe_doom_hatchet:0 "Doom-Hatchet"
 kns_art_axe_doom_hatchet_desc:0 "Small enough to hide, heavy enough to end a line. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_mjolnir:0 "Mjolnir"
 kns_art_hammer_mjolnir_desc:0 "Thor's hammer in the old songs, short-hafted and world-breaking. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_martel:0 "Martel"
 kns_art_hammer_martel_desc:0 "Named for Charles the Hammer, who broke the raid at Tours. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_smith_of_war:0 "The Smith of War"
 kns_art_hammer_smith_of_war_desc:0 "A knight's hammer that forges silence out of shields. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_anvil_ender:0 "Anvil-Ender"
 kns_art_hammer_anvil_ender_desc:0 "It has ruined more armor than any forge-fire. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_bone_mill:0 "Bone-Mill"
 kns_art_hammer_bone_mill_desc:0 "A war-hammer whose head is scored like a millstone. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_bell_tongue:0 "Bell-Tongue"
 kns_art_hammer_bell_tongue_desc:0 "It rings on helms the way a clapper rings bronze. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_chapel_knocker:0 "Chapel-Knocker"
 kns_art_hammer_chapel_knocker_desc:0 "A cruel name from a siege of a stone church. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_crow_hammer:0 "Crow-Hammer"
 kns_art_hammer_crow_hammer_desc:0 "Beaked on one side, blunt on the other. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_oath_peen:0 "Oath-Peen"
 kns_art_hammer_oath_peen_desc:0 "Used once to nail a treaty to a hall-door, and many times since. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_ice_maul:0 "Ice-Maul"
 kns_art_hammer_ice_maul_desc:0 "A long maul carried across frozen rivers. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_saint_eloi:0 "Saint Eloi's Debt"
 kns_art_hammer_saint_eloi_desc:0 "Named for the smith-saint, though no altar would bless it. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_gate_tooth:0 "Gate-Tooth"
 kns_art_hammer_gate_tooth_desc:0 "Made to start a door, then turned on the men behind it. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_riders_end:0 "Rider's End"
 kns_art_hammer_riders_end_desc:0 "Weighted to pull a horseman from the saddle. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_black_peen:0 "Black-Peen"
 kns_art_hammer_black_peen_desc:0 "The striking face is dark iron, never polished. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_wakes_the_dead:0 "It Wakes the Dead"
 kns_art_hammer_wakes_the_dead_desc:0 "So loud on plate that sleepers rise for the last time. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_ford_hammer:0 "Ford-Hammer"
 kns_art_hammer_ford_hammer_desc:0 "Famous from a river battle where horses could not turn. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_monk_bell:0 "Monk-Bell"
 kns_art_hammer_monk_bell_desc:0 "A two-handed hammer that sounds like a sacring bell. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_nail_god:0 "Nail-God"
 kns_art_hammer_nail_god_desc:0 "It drives men into the dirt as a nail into a beam. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_storm_mallet:0 "Storm-Mallet"
 kns_art_hammer_storm_mallet_desc:0 "Said to have been carried in a year of endless rain. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_grave_maul:0 "Grave-Maul"
 kns_art_hammer_grave_maul_desc:0 "Used to drive posts, then to fill graves. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_helm_singer:0 "Helm-Singer"
 kns_art_hammer_helm_singer_desc:0 "Every stroke a note; every helm a cracked bell. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_the_mason:0 "The Mason"
 kns_art_hammer_the_mason_desc:0 "It works stone and men with the same patience. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_red_star:0 "Red-Star"
 kns_art_hammer_red_star_desc:0 "The flanged head is shaped like a bleeding star. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_winter_weight:0 "Winter-Weight"
 kns_art_hammer_winter_weight_desc:0 "Heavy as a sack of ice, twice as honest. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_law_hammer:0 "Law-Hammer"
 kns_art_hammer_law_hammer_desc:0 "A judge's joke: it gives the last verdict. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_boar_maul:0 "Boar-Maul"
 kns_art_hammer_boar_maul_desc:0 "Short, brutal, made for the press of the melee. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_ash_breaker:0 "Ash-Breaker"
 kns_art_hammer_ash_breaker_desc:0 "Named for the spear-shafts it turns to kindling. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_crooked_saint:0 "The Crooked Saint"
 kns_art_hammer_crooked_saint_desc:0 "A hammer taken from a chapel and never returned. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_iron_gospel:0 "Iron Gospel"
 kns_art_hammer_iron_gospel_desc:0 "It preaches on the crown of a helm. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_hammer_last_forge:0 "Last Forge"
 kns_art_hammer_last_forge_desc:0 "The only anvil its victims will ever visit. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_odo_mace:0 "Odo's Right"
 kns_art_mace_odo_mace_desc:0 "After Bishop Odo, who would not shed blood with a sword's edge. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_morning_star:0 "Morning Star of Antioch"
 kns_art_mace_morning_star_desc:0 "A spiked head that opened the dawn over a broken siege. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_holy_knob:0 "The Holy Knob"
 kns_art_mace_holy_knob_desc:0 "A priest-knight's mace, blunt and pitiless. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_skull_orb:0 "Skull-Orb"
 kns_art_mace_skull_orb_desc:0 "A simple iron ball on a short haft, needing no beauty. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_flanged_mercy:0 "Flanged Mercy"
 kns_art_mace_flanged_mercy_desc:0 "Six flanges; no mercy at all. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_cantor:0 "The Cantor"
 kns_art_mace_cantor_desc:0 "It keeps time on helmets during the charge. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_pewter_saint:0 "Pewter Saint"
 kns_art_mace_pewter_saint_desc:0 "Cast like a church ornament, used like a crime. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_crown_cracker:0 "Crown-Cracker"
 kns_art_mace_crown_cracker_desc:0 "Made for kings who wear iron to bed. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_rood_mace:0 "Rood-Mace"
 kns_art_mace_rood_mace_desc:0 "The head is cross-shaped; the sermon is short. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_black_scepter:0 "Black Scepter"
 kns_art_mace_black_scepter_desc:0 "A lordly mace that rules only the dying. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_vineyard:0 "The Vineyard"
 kns_art_mace_vineyard_desc:0 "Flanges like grape-stems, purple after a fight. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_gate_key:0 "Gate-Key"
 kns_art_mace_gate_key_desc:0 "It opens helms the way a key opens a lock: by breaking them. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_pax:0 "Pax"
 kns_art_mace_pax_desc:0 "Named in bitter jest for the peace it leaves behind. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_tithing:0 "The Tithing"
 kns_art_mace_tithing_desc:0 "It takes a tenth of a man and calls it plenty. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_iron_psalm:0 "Iron Psalm"
 kns_art_mace_iron_psalm_desc:0 "Sung on the march, finished on a visor. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_bulb_of_cain:0 "Bulb of Cain"
 kns_art_mace_bulb_of_cain_desc:0 "A round head, old as murder. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_knuckle_mass:0 "Knuckle-Mass"
 kns_art_mace_knuckle_mass_desc:0 "Short enough for a stirrup, heavy enough for a duke. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_white_flange:0 "White-Flange"
 kns_art_mace_white_flange_desc:0 "Polished flanges that do not stay white. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_sexton:0 "The Sexton"
 kns_art_mace_sexton_desc:0 "It digs no graves, but it fills them. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_reliquary:0 "The Reliquary"
 kns_art_mace_reliquary_desc:0 "Hollow-headed, once meant for a saint's bone. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_storm_knob:0 "Storm-Knob"
 kns_art_mace_storm_knob_desc:0 "Carried in a night of hail and horns. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_lawgiver:0 "Lawgiver"
 kns_art_mace_lawgiver_desc:0 "A civic mace taken to war and never brought home. The steel is illustrious, and there is no sharper prowess in a mortal weapon."
 kns_art_mace_red_chaplet:0 "Red Chaplet"
