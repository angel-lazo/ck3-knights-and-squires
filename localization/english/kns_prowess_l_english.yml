l_english:
 game_concept_kns_prowess_talent:0 "Gift at Arms"
 game_concept_kns_prowess_talent_desc:0 "Every [kns_knight|E] is born with a natural ceiling for [prowess|E], rolled on a curve that clusters around 15. The cap is compared to prowess without weapons. You choose whom to fund. Funded training raises prowess toward that cap, but never past it. Weapons can still push the shown total above the cap. Knights who can lose prowess from Old Age (from 45) cannot be funded. Those who age without that penalty still can. The stipend of 0.5 gold each month continues after the cap is reached."
 game_concept_kns_prowess_talents:0 "Gifts at Arms"

 trait_kns_talent_unskilled:0 "Inept"
 trait_kns_talent_unskilled_desc:0 "Clumsy in the yard and slow to learn. This knight's gift at arms is meagre; their prowess cap is 1-5."
 trait_kns_talent_unskilled_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is inept at arms. No amount of drill will make a true warrior of [ROOT.GetCharacter.GetHerHim]."
 trait_kns_talent_low:0 "Mediocre"
 trait_kns_talent_low_desc:0 "A common hand with sword and lance. This knight may keep a place in the line, but will never be sung. Their prowess cap is 6-14."
 trait_kns_talent_low_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a mediocre fighter. Honest training may help, but only so far."
 trait_kns_talent_normal:0 "Able"
 trait_kns_talent_normal_desc:0 "A sound and serviceable knight, as most men-at-arms are judged. Their prowess cap is 15-29."
 trait_kns_talent_normal_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is an able knight. With a lord's coin for training, [ROOT.GetCharacter.GetSheHe] may become a credit to the household."
 trait_kns_talent_elite:0 "Formidable"
 trait_kns_talent_elite_desc:0 "A rare and dangerous gift. This knight may become the terror of the tourney and the battlefield. Their prowess cap is 30-49."
 trait_kns_talent_elite_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is formidable. If [ROOT.GetCharacter.GetHerHis] liege keeps the stipend, the realm will learn [ROOT.GetCharacter.GetHerHis] name."
 trait_kns_talent_generation:0 "Prodigious"
 trait_kns_talent_generation_desc:0 "A marvel of the age, the sort of knight sung of for a hundred years. Their prowess cap is 50."
 trait_kns_talent_generation_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is prodigious. There is almost no ceiling on what training can make of [ROOT.GetCharacter.GetHerHim]."

 kns_in_prowess_training:0 "Funded Knight"
 kns_in_prowess_training_desc:0 "This [kns_knight|E] is kept in training at 0.5 gold each month and eats a better diet. [ROOT.GetCharacter.GetSheHe|U] has a medium [health|E] boost. If prowess without weapons is still below a cap of [ROOT.GetCharacter.Custom('KnsProwessCap')], yearly growth depends on age: 0-5 under 30, 0-3 from 30 to 45, and 0-1 from 46. Weapons can still raise displayed [prowess|E] above the cap. Funding ends at 45 unless they do not lose prowess from Old Age. The stipend continues after they reach the cap."
 kns_funding_knight_training:0 "Funding Knights"
 kns_funding_knight_training_desc:0 "You pay 0.5 gold each month for every [kns_knight|E] you have chosen to fund, even after they reach their [kns_prowess_talent|E] cap."
 kns_training_upkeep_1:0 "Knight Stipend"
 kns_training_upkeep_1_desc:0 "0.5 gold each month for each funded knight, whether or not they have reached their cap."
 kns_training_upkeep_2:0 "Knight Stipend"
 kns_training_upkeep_2_desc:0 "0.5 gold each month for each funded knight, whether or not they have reached their cap."
 kns_training_upkeep_4:0 "Knight Stipend"
 kns_training_upkeep_4_desc:0 "0.5 gold each month for each funded knight, whether or not they have reached their cap."
 kns_training_upkeep_8:0 "Knight Stipend"
 kns_training_upkeep_8_desc:0 "0.5 gold each month for each funded knight, whether or not they have reached their cap."
 kns_training_upkeep_16:0 "Knight Stipend"
 kns_training_upkeep_16_desc:0 "0.5 gold each month for each funded knight, whether or not they have reached their cap."

 kns_fund_knight_interaction:0 "Fund Knight"
 kns_fund_knight_interaction_desc:0 "Pay 0.5 gold each month to keep [recipient.GetShortUIName] in training and on a better diet. [recipient.GetSheHe|U] gains a medium [health|E] boost, may gain prowess each year until [recipient.GetHerHis] cap, and the stipend continues after that."
 kns_fund_knight:0 "Fund Knight"
 kns_fund_knight_toast:0 "Knight Funded"
 kns_fund_knight_toast.tt:0 "You will pay 0.5 gold each month to train this [kns_knight|E]."
 kns_stop_funding_knight_interaction:0 "Disable Funding"
 kns_stop_funding_knight_interaction_desc:0 "Stop paying the monthly stipend for [recipient.GetShortUIName]. [recipient.GetSheHe|U] will no longer gain prowess from training, and you will no longer be charged 0.5 gold each month."
 kns_stop_funding_knight:0 "Disable Funding"
 kns_stop_funding_knight_toast:0 "Funding Disabled"
 kns_stop_funding_knight_toast.tt:0 "You no longer pay to train this [kns_knight|E]."

