 kns_imperial_olympic_decision:0 "Hold Imperial Olympic Games"
 kns_imperial_olympic_decision_desc:0 "Found the Imperial Olympic Games as an institution of your empire. You choose the bracket, how often they return (every 2, 3, or 4 years), the fund (1000–5000 gold), and the venue (capital, or any realm county). After that the games run on their own; use Manage Imperial Olympic Games to change the settings.\n\nUse #V Select Imperial Olympic Champions#! first to choose who represents your realm.\n\nThe victor takes five thousand prestige and 40% of the gold you funded. The host county's taxes rise for six months (up to +50% at a full purse). A richer fund also makes your knights more effective.\n\n#weak Player only. AI emperors will not use this decision.#!"
 kns_imperial_olympic_decision_tooltip:0 "Found the Imperial Olympic Games"
 kns_imperial_olympic_decision_confirm:0 "Hold Games"
 kns_imperial_olympic_manage_decision:0 "Manage Imperial Olympic Games"
 kns_imperial_olympic_manage_decision_desc:0 "Change the cycle, purse, bracket, or venue of your Imperial Olympic Games. The lists still raise themselves when the cycle comes due. You may also raise them early if no bracket is running."
 kns_imperial_olympic_manage_decision_tooltip:0 "Change how the Imperial Olympic Games are held"
 kns_imperial_olympic_manage_decision_confirm:0 "Manage Games"
 kns_imperial_olympic_continue_decision:0 "Continue the Imperial Olympic Games"
 kns_imperial_olympic_continue_decision_desc:0 "Your predecessor paid to raise the Imperial Olympic Games. If you are emperor, you may take up that tradition at no further cost. You will set how often the lists return and what gold purse the champion takes. An AI emperor will not continue this custom."
 kns_imperial_olympic_continue_decision_tooltip:0 "Take up the games at no cost. You will choose the cycle and the purse."
 kns_imperial_olympic_continue_decision_confirm:0 "Continue Games"
 kns_imperial_olympic_knighthood_tt:0 "Your faith practices Christian knighthood"
 kns_imperial_olympic_available_adult_tt:0 "You are an available adult"

 kns_imperial_olympic_select_champions_decision:0 "Select Imperial Olympic Champions"
 kns_imperial_olympic_select_champions_decision_desc:0 "Choose which male court knights - and optionally yourself - will represent your realm. You may send up to four: yourself uses a slot, and remaining slots are for knights.\n\nWomen cannot enter the lists. Only men, preferably dubbed knights, are taken."
 kns_imperial_olympic_select_champions_decision_tooltip:0 "Open the champion selection window"
 kns_imperial_olympic_select_champions_decision_confirm:0 "Select Champions"

 kns_imperial_olympic_hall_of_fame_decision:0 "View Hall of Legends"
