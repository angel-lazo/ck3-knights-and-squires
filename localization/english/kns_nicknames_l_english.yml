l_english:
 nick_kns_sword_01:0 "the Sword-Saint"
 nick_kns_sword_01_desc:0 "After five years of war the priests themselves said the blade in [ROOT.GetCharacter.GetHerHis] hand had learned a liturgy. They named [ROOT.GetCharacter.GetFirstNameNoTooltip] [ROOT.GetCharacter.GetNicknameNoTooltip] when [ROOT.GetCharacter.GetSheHe] cut a sacrilege out of a chapel and left the altar standing."
 nick_kns_sword_02:0 "the Red Sword"
 nick_kns_sword_02_desc:0 "A ford ran clear in the morning and red by noon. The survivors called [ROOT.GetCharacter.GetFirstNameNoTooltip] [ROOT.GetCharacter.GetNicknameNoTooltip], for [ROOT.GetCharacter.GetHerHis] sword never went back into the scabbard dry that year."
 nick_kns_sword_03:0 "the Pale Blade"
 nick_kns_sword_03_desc:0 "In a winter campaign [ROOT.GetCharacter.GetFirstNameNoTooltip] fought in white harness against men in white snow. They named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip] because the only color left on the field was the steel."
 nick_kns_sword_04:0 "Widowmaker"
 nick_kns_sword_04_desc:0 "A count's household rode out with forty lances and came home with none. The widows, who are honest, named [ROOT.GetCharacter.GetFirstNameNoTooltip] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_05:0 "Oath-Cutter"
 nick_kns_sword_05_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ended a false truce with one stroke across a sworn hand. The hall called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip], and no one offered [ROOT.GetCharacter.GetHerHim] their palm again without meaning it."
 nick_kns_sword_06:0 "Kingsbane"
 nick_kns_sword_06_desc:0 "A crowned man came to put [ROOT.GetCharacter.GetFirstNameNoTooltip] in irons and left the crown in the mud. Singers shortened the tale and called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_07:0 "the White Sword"
 nick_kns_sword_07_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] kept a blade so clean it looked unused, though the graveyards knew better. They named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip] for that cruel cleanliness."
 nick_kns_sword_08:0 "Stormcutter"
 nick_kns_sword_08_desc:0 "On a night of wind that tore tents from their pegs, [ROOT.GetCharacter.GetFirstNameNoTooltip] held a ridge alone. The men who found [ROOT.GetCharacter.GetHerHim] at dawn named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_09:0 "the Oathbound Blade"
 nick_kns_sword_09_desc:0 "Five years after the dubbing, [ROOT.GetCharacter.GetFirstNameNoTooltip] still kept the words spoken over the sword. Lords who break faith began to call [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip] as a warning to each other."
 nick_kns_sword_10:0 "Hell's Edge"
 nick_kns_sword_10_desc:0 "A raid into a burning town should have killed any mortal man. [ROOT.GetCharacter.GetFirstNameNoTooltip] came out with a blackened sword, and the fleeing named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_11:0 "the Grave-Sword"
 nick_kns_sword_11_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] took a blade from a barrow and paid for it in living men. After the fifth year they stopped asking whose grave and called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_12:0 "Wolf's Tooth"
 nick_kns_sword_12_desc:0 "In the woods [ROOT.GetCharacter.GetFirstNameNoTooltip] fought like something that does not care if it lives. Huntsmen crossed themselves and said [ROOT.GetCharacter.GetNicknameNoTooltip] had a human face."
 nick_kns_sword_13:0 "the Lion's Sword"
 nick_kns_sword_13_desc:0 "A tourney king fell, and then a real one nearly did. The lists and the war-camp agreed: [ROOT.GetCharacter.GetFirstNameNoTooltip] was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_14:0 "Ravenblade"
 nick_kns_sword_14_desc:0 "Crows followed [ROOT.GetCharacter.GetHerHis] banner for a season and would not follow another. Camp Latin made it a name, and the name was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_15:0 "the Iron Vow"
 nick_kns_sword_15_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] swore not to sheathe the sword until a castle opened. It opened. They called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip] as if the stone itself had surrendered to a sentence."
 nick_kns_sword_16:0 "Bone-Singer"
 nick_kns_sword_16_desc:0 "The sword made a sound on ribs that men remembered in church. A chaplain, unwise, called [ROOT.GetCharacter.GetFirstNameNoTooltip] [ROOT.GetCharacter.GetNicknameNoTooltip] in a sermon, and it stuck."
 nick_kns_sword_17:0 "the Dawn Sword"
 nick_kns_sword_17_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] attacked at first light so often that sentries feared the color of the sky. They named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_18:0 "Night-Edge"
 nick_kns_sword_18_desc:0 "A gate was taken without a horn. The only witness was a cut lock and a dead porter. The town whispered [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_19:0 "the Thorned Blade"
 nick_kns_sword_19_desc:0 "Every victory cost [ROOT.GetCharacter.GetFirstNameNoTooltip] a little blood of [ROOT.GetCharacter.GetHerHis] own. They said the sword drank both ways, and called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_20:0 "Saint-Cleaver"
 nick_kns_sword_20_desc:0 "A wicked bishop put on armor and called it holy. [ROOT.GetCharacter.GetFirstNameNoTooltip] unmade the argument. The poor, who had paid the tithe, named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_21:0 "the Sable Sword"
 nick_kns_sword_21_desc:0 "Black cloth on the hilt, black work in the field. After five years the heralds wrote [ROOT.GetCharacter.GetFirstNameNoTooltip] as [ROOT.GetCharacter.GetNicknameNoTooltip] and did not smile."
 nick_kns_sword_22:0 "Gold-Biter"
 nick_kns_sword_22_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ruined a gilded helm that had been a prince's pride. Minstrels, who love a joke that bleeds, named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_23:0 "the Widow's Sword"
 nick_kns_sword_23_desc:0 "A lady gave [ROOT.GetCharacter.GetFirstNameNoTooltip] a blade and a wrong to right. When it was righted, both armies called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_24:0 "Ash-Edge"
 nick_kns_sword_24_desc:0 "A hall burned. [ROOT.GetCharacter.GetFirstNameNoTooltip] stood in the doorway and the doorway was enough. They named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip] for the grey on the steel."
 nick_kns_sword_25:0 "the Oath of Steel"
 nick_kns_sword_25_desc:0 "Men began to swear by [ROOT.GetCharacter.GetFirstNameNoTooltip]'s sword instead of relics. Priests disliked it. Soldiers did not. The name [ROOT.GetCharacter.GetNicknameNoTooltip] outlived the argument."
 nick_kns_sword_26:0 "Red-Hilt"
 nick_kns_sword_26_desc:0 "The grip darkened and never lightened. Pages refused to touch it. The knight who held it became [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_27:0 "the Quiet Sword"
 nick_kns_sword_27_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] does not boast. The dead do the talking. After five years even enemies used the name [ROOT.GetCharacter.GetNicknameNoTooltip] with something like respect."
 nick_kns_sword_28:0 "Mail-Opener"
 nick_kns_sword_28_desc:0 "Rings meant nothing. A captured armorer said so first, and the name [ROOT.GetCharacter.GetNicknameNoTooltip] walked from that workbench into every camp."
 nick_kns_sword_29:0 "the Crooked Cross"
 nick_kns_sword_29_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] cut down a man who wore a cross for a license to rob. Pilgrims named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip] and meant it as thanks."
 nick_kns_sword_30:0 "Winterblade"
 nick_kns_sword_30_desc:0 "A campaign in snow that killed horses left [ROOT.GetCharacter.GetFirstNameNoTooltip] still standing. They chipped a name out of the ice: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_31:0 "the Barrow Edge"
 nick_kns_sword_31_desc:0 "Folk said [ROOT.GetCharacter.GetSheHe] had borrowed a dead king's anger. [ROOT.GetCharacter.GetFirstNameNoTooltip] did not deny it. Denial is for men who need [ROOT.GetCharacter.GetNicknameNoTooltip] explained."
 nick_kns_sword_32:0 "Serpent's Tongue"
 nick_kns_sword_32_desc:0 "The blade was narrow and the wounds were worse. Surgeons invented the name [ROOT.GetCharacter.GetNicknameNoTooltip] because they were tired of lying to widows."
 nick_kns_sword_33:0 "the Vow-Sword"
 nick_kns_sword_33_desc:0 "A broken betrothal became a war. [ROOT.GetCharacter.GetFirstNameNoTooltip] ended the war and would not take the bride. They called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip] anyway."
 nick_kns_sword_34:0 "Helm-Reaper"
 nick_kns_sword_34_desc:0 "Visors opened like harvest. A sergeant counted eleven in one fight and started the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_35:0 "the Black Oath"
 nick_kns_sword_35_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] swore in a chapel with no light but the sword. Five years later the chapel was famous, and so was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_36:0 "Crowsbane"
 nick_kns_sword_36_desc:0 "A battlefield so thick with birds that men gagged. [ROOT.GetCharacter.GetFirstNameNoTooltip] walked through it as if it were a courtyard. They named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_37:0 "the Just Sword"
 nick_kns_sword_37_desc:0 "Judges began to send [ROOT.GetCharacter.GetFirstNameNoTooltip] instead of writs. That is how a knight becomes [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_38:0 "Flame-Edge"
 nick_kns_sword_38_desc:0 "Oil, a gate, a scream. [ROOT.GetCharacter.GetFirstNameNoTooltip] was the one who came out. The name [ROOT.GetCharacter.GetNicknameNoTooltip] smelled of pitch for a year."
 nick_kns_sword_39:0 "the Unsmiling Blade"
 nick_kns_sword_39_desc:0 "A jester died making the wrong joke. After that, no one asked [ROOT.GetCharacter.GetFirstNameNoTooltip] to smile, only to be [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_40:0 "Kin-Cutter"
 nick_kns_sword_40_desc:0 "A feud that had eaten three generations ended on [ROOT.GetCharacter.GetHerHis] sword. Both houses, exhausted, named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_41:0 "the River Sword"
 nick_kns_sword_41_desc:0 "Bodies went downstream with the same current as the stories. Villages along the water called [ROOT.GetCharacter.GetFirstNameNoTooltip] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_42:0 "Saint-Steel"
 nick_kns_sword_42_desc:0 "A relic was faked; a riot followed; [ROOT.GetCharacter.GetFirstNameNoTooltip] ended both. The bishop who lived called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip] in writing."
 nick_kns_sword_43:0 "the Long Grief"
 nick_kns_sword_43_desc:0 "Enemies said it was better to die at once than to be left alive by [ROOT.GetCharacter.GetFirstNameNoTooltip]. That complaint became the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_44:0 "Woe-Edge"
 nick_kns_sword_44_desc:0 "A poet needed a short word for a long slaughter. He wrote [ROOT.GetCharacter.GetNicknameNoTooltip], and the army adopted the line."
 nick_kns_sword_45:0 "the Broken Crown"
 nick_kns_sword_45_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] dented a coronet and refused to pick it up. Chroniclers, who love symbols, named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_46:0 "Duskblade"
 nick_kns_sword_46_desc:0 "Always the last fight of the day, always [ROOT.GetCharacter.GetFirstNameNoTooltip] still on [ROOT.GetCharacter.GetHerHis] feet. Night-watches named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_47:0 "the Blood Oath"
 nick_kns_sword_47_desc:0 "Five companions swore; four are in the ground; [ROOT.GetCharacter.GetFirstNameNoTooltip] kept walking. The fifth name was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_48:0 "Gallows-Edge"
 nick_kns_sword_48_desc:0 "A sheriff hanged the wrong man. [ROOT.GetCharacter.GetFirstNameNoTooltip] hanged the sheriff, in a manner of speaking. The shire said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_49:0 "the Pale Oath"
 nick_kns_sword_49_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] fought fever and a siege at once and would not yield the sword. Sisters of the hospital named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_50:0 "Thorn-Sword"
 nick_kns_sword_50_desc:0 "Every peace [ROOT.GetCharacter.GetFirstNameNoTooltip] made grew a new war. They still wanted [ROOT.GetCharacter.GetHerHim] in it. That is the price of being [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_51:0 "the Wolf Sword"
 nick_kns_sword_51_desc:0 "A starving winter, a raid on a granary, a lord who hoarded. The peasants' name for their savior was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_52:0 "Iron Evangel"
 nick_kns_sword_52_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] converted no one and buried many. A mocking clerk wrote [ROOT.GetCharacter.GetNicknameNoTooltip]; soldiers wore it as a compliment."
 nick_kns_sword_53:0 "the Last Argument"
 nick_kns_sword_53_desc:0 "When talks failed, they sent [ROOT.GetCharacter.GetFirstNameNoTooltip]. Diplomats coined [ROOT.GetCharacter.GetNicknameNoTooltip] so they would not have to describe the result."
 nick_kns_sword_54:0 "Sorrow-Edge"
 nick_kns_sword_54_desc:0 "A friend died under [ROOT.GetCharacter.GetHerHis] guard. The next five years were other men's sorrow. They still named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_55:0 "the Chapel Sword"
 nick_kns_sword_55_desc:0 "Sanctuary was claimed by a murderer. [ROOT.GetCharacter.GetFirstNameNoTooltip] decided what sanctuary meant. The parish remembers [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_56:0 "Red Vow"
 nick_kns_sword_56_desc:0 "A ribbon on the hilt until the ribbon rotted. The color stayed in the stories. The name was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_57:0 "the Unsheathed"
 nick_kns_sword_57_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] took a vow of the drawn sword for a year and forgot to end it. Five years made it [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_58:0 "Barrow-Biter"
 nick_kns_sword_58_desc:0 "Grave-goods and living lords look the same to some steel. [ROOT.GetCharacter.GetFirstNameNoTooltip] was careful. The careful still called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_59:0 "the Crossed Edge"
 nick_kns_sword_59_desc:0 "Two armies, one bridge, no room to turn. [ROOT.GetCharacter.GetFirstNameNoTooltip] made room. The bridge kept the name [ROOT.GetCharacter.GetNicknameNoTooltip] longer than its stones."
 nick_kns_sword_60:0 "Hearth-Cleaver"
 nick_kns_sword_60_desc:0 "A tyrant was killed at his own table. Hospitality has rules; so does hunger. The hungry named [ROOT.GetCharacter.GetFirstNameNoTooltip] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_61:0 "the Silent Edge"
 nick_kns_sword_61_desc:0 "No war-cry. Only the work. Recruits were told, if you hear nothing, it is already [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_62:0 "Oath-Eater"
 nick_kns_sword_62_desc:0 "A man famous for promises met [ROOT.GetCharacter.GetFirstNameNoTooltip]. Afterward the realm had one fewer liar and one new name: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_63:0 "the Rune Sword"
 nick_kns_sword_63_desc:0 "Marks on the blade no priest could read. After enough miracles of butchery, reading was unnecessary. They said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_64:0 "Frost-Edge"
 nick_kns_sword_64_desc:0 "A lake battle on thin ice. [ROOT.GetCharacter.GetFirstNameNoTooltip] came across. Others did not. The name [ROOT.GetCharacter.GetNicknameNoTooltip] is still used when the lake freezes."
 nick_kns_sword_65:0 "the Banner Sword"
 nick_kns_sword_65_desc:0 "A color fell; [ROOT.GetCharacter.GetFirstNameNoTooltip] did not. The color was raised on [ROOT.GetCharacter.GetHerHis] blade until a new shaft was cut. Heralds wrote [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_66:0 "God's Nail"
 nick_kns_sword_66_desc:0 "A chaplain saw [ROOT.GetCharacter.GetFirstNameNoTooltip] fix a shield-wall the way a nail fixes a plank. The metaphor escaped and became [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_67:0 "the Wasting Blade"
 nick_kns_sword_67_desc:0 "Wounds from [ROOT.GetCharacter.GetHerHis] sword soured. Camp surgeons blamed the steel. The steel's owner became [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_68:0 "Lark-Tongue"
 nick_kns_sword_68_desc:0 "A thin blade and a high scream. Archers, who name everything, named [ROOT.GetCharacter.GetFirstNameNoTooltip] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_69:0 "the Debt Sword"
 nick_kns_sword_69_desc:0 "Every man [ROOT.GetCharacter.GetFirstNameNoTooltip] killed had owed someone. Collectors, grimly grateful, used the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_70:0 "Pyre-Edge"
 nick_kns_sword_70_desc:0 "The dead were too many to bury. [ROOT.GetCharacter.GetFirstNameNoTooltip] stood by the fire as if it were a hearth. They called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_71:0 "the Narrow Mercy"
 nick_kns_sword_71_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] learned to end men quickly. The quickly-ended do not complain. The living called that skill [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_72:0 "Salt-Blade"
 nick_kns_sword_72_desc:0 "A coastal war, rust, and a sword that still bit. Sailors, who know metal, named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_73:0 "the Third Son"
 nick_kns_sword_73_desc:0 "No inheritance but a blade. Five years later the elder brothers were footnotes. The realm filed [ROOT.GetCharacter.GetFirstNameNoTooltip] under [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_74:0 "Hive-Sword"
 nick_kns_sword_74_desc:0 "Enemies said being near [ROOT.GetCharacter.GetFirstNameNoTooltip] was like putting a hand in bees. The metaphor hardened into [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_75:0 "the Bent Halo"
 nick_kns_sword_75_desc:0 "A saint's medal hung from the pommel and was struck flat. Folk said even heaven flinched, and used [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_76:0 "Cinder-Edge"
 nick_kns_sword_76_desc:0 "A village was ash; the raiders were also ash. The few who hid named their deliverer [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_77:0 "the Open Vein"
 nick_kns_sword_77_desc:0 "A duel that should have been first blood went further. The crowd, honest for once, shouted [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_78:0 "Brother-Steel"
 nick_kns_sword_78_desc:0 "A companion died; [ROOT.GetCharacter.GetFirstNameNoTooltip] carried both swords for a year. The second scabbard taught the world [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_79:0 "the Low Mass"
 nick_kns_sword_79_desc:0 "Killing done at dawn with almost no words. A blasphemous sergeant coined [ROOT.GetCharacter.GetNicknameNoTooltip] and was not punished."
 nick_kns_sword_80:0 "Ridge-Cutter"
 nick_kns_sword_80_desc:0 "A hill changed hands seven times. The eighth time [ROOT.GetCharacter.GetFirstNameNoTooltip] kept it. Maps, if they could speak, would say [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_81:0 "the Unasked Sword"
 nick_kns_sword_81_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] arrived at wars nobody invited [ROOT.GetCharacter.GetHerHim] to, and ended them. Invitation became unnecessary. They used [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_82:0 "Penny-Edge"
 nick_kns_sword_82_desc:0 "Soldiers said [ROOT.GetCharacter.GetFirstNameNoTooltip]'s stroke was the only honest coin in a bad war. Paymasters hated the joke. The name [ROOT.GetCharacter.GetNicknameNoTooltip] stayed."
 nick_kns_sword_83:0 "the Closed Book"
 nick_kns_sword_83_desc:0 "Clerks stopped writing the names of [ROOT.GetCharacter.GetHerHis] dead; the list had no end. The heading they used was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_84:0 "Yew-Sword"
 nick_kns_sword_84_desc:0 "Woodsmen saw [ROOT.GetCharacter.GetFirstNameNoTooltip] fight among trees as if the forest were a nave. They offered the name [ROOT.GetCharacter.GetNicknameNoTooltip] like a blessing."
 nick_kns_sword_85:0 "the Last Sheath"
 nick_kns_sword_85_desc:0 "A vow: the scabbard would be a grave. Five years, and it still hung empty. People pointed and said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_86:0 "Mire-Blade"
 nick_kns_sword_86_desc:0 "A battle in mud that swallowed horses. [ROOT.GetCharacter.GetFirstNameNoTooltip] stood where the mud was worst. That place is still called [ROOT.GetCharacter.GetNicknameNoTooltip]'s stand."
 nick_kns_sword_87:0 "the Tithe Sword"
 nick_kns_sword_87_desc:0 "A lord took too much. [ROOT.GetCharacter.GetFirstNameNoTooltip] took the lord. Peasants, who understand percentages, named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_88:0 "Glass-Edge"
 nick_kns_sword_88_desc:0 "It looked too fine to use. Then it was used. Courtiers who had laughed said [ROOT.GetCharacter.GetNicknameNoTooltip] with a different mouth."
 nick_kns_sword_89:0 "the Sleepless Steel"
 nick_kns_sword_89_desc:0 "Watches broke around [ROOT.GetCharacter.GetFirstNameNoTooltip] because [ROOT.GetCharacter.GetSheHe] did not. The night-guard's nickname leaked into daylight: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_90:0 "Horn-Cutter"
 nick_kns_sword_90_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] silenced a rallying horn with a thrown cut no one later believed. Belief is optional. The name [ROOT.GetCharacter.GetNicknameNoTooltip] is not."
 nick_kns_sword_91:0 "the Pale Tithe"
 nick_kns_sword_91_desc:0 "Plague and war together. [ROOT.GetCharacter.GetFirstNameNoTooltip] buried and slew in the same week. Monks wrote [ROOT.GetCharacter.GetNicknameNoTooltip] in the margin of the death-roll."
 nick_kns_sword_92:0 "Stone-Singer"
 nick_kns_sword_92_desc:0 "A sword on a helm on a stone wall: three notes, one man down. Masons started it. Armies finished it. [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_93:0 "the Unpaid Blade"
 nick_kns_sword_93_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] refused silver for a killing that needed doing. That frightened the sort of men who buy deaths. They said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_94:0 "Briar-Sword"
 nick_kns_sword_94_desc:0 "A retreat through thorns. [ROOT.GetCharacter.GetFirstNameNoTooltip] went last. The pursuers counted their missing and invented [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_95:0 "the Cold Gospel"
 nick_kns_sword_95_desc:0 "No miracles, only outcomes. A heretic-hunter tried to recruit [ROOT.GetCharacter.GetFirstNameNoTooltip] and was refused. Both sides still used [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_96:0 "Whet-Vow"
 nick_kns_sword_96_desc:0 "They say [ROOT.GetCharacter.GetFirstNameNoTooltip] sharpens before every mass. Whether that is piety or hunger, the name [ROOT.GetCharacter.GetNicknameNoTooltip] covers both."
 nick_kns_sword_97:0 "the Empty Throne"
 nick_kns_sword_97_desc:0 "A usurper sat. [ROOT.GetCharacter.GetFirstNameNoTooltip] stood. The chair was empty again. Chroniclers, lazy and accurate, wrote [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_98:0 "Sable Vow"
 nick_kns_sword_98_desc:0 "Mourning cloth on the sword-belt long after the funeral. Five years is a long mourning. They called it [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_99:0 "the Cut Peace"
 nick_kns_sword_99_desc:0 "A treaty signed in a tent; a dagger under the table; [ROOT.GetCharacter.GetFirstNameNoTooltip]'s answer. Diplomacy named its failure [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_sword_100:0 "Amen-Edge"
 nick_kns_sword_100_desc:0 "Last word in a lot of prayers that ended mid-sentence. A deacon heard himself say [ROOT.GetCharacter.GetNicknameNoTooltip] and could not take it back."
 nick_kns_axe_01:0 "the Axe of God"
 nick_kns_axe_01_desc:0 "A priest called the stroke providence, then recanted, then died of other causes. The soldiers kept the first version and named [ROOT.GetCharacter.GetFirstNameNoTooltip] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_02:0 "Skull-Hewer"
 nick_kns_axe_02_desc:0 "Helms are a theory. [ROOT.GetCharacter.GetFirstNameNoTooltip] is a practice. After five years of practice the camps said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_03:0 "the Bearded Axe"
 nick_kns_axe_03_desc:0 "The hook pulled riders down like fruit. Children in the supply train sang a cruel rhyme that ended in [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_04:0 "Shield-Biter"
 nick_kns_axe_04_desc:0 "Linden and leather became kindling. A captured carpenter said he had never seen oak opened so fast, and the name [ROOT.GetCharacter.GetNicknameNoTooltip] was born."
 nick_kns_axe_05:0 "the Dane"
 nick_kns_axe_05_desc:0 "Whether [ROOT.GetCharacter.GetFirstNameNoTooltip] had a drop of northern blood did not matter. The axe made the argument. They called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_06:0 "Hel's Door"
 nick_kns_axe_06_desc:0 "Men hit by [ROOT.GetCharacter.GetFirstNameNoTooltip] did not linger. Healers, grateful for the lack of work, whispered [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_07:0 "the Widow's Axe"
 nick_kns_axe_07_desc:0 "A woman put the weapon in [ROOT.GetCharacter.GetHerHis] hands and a name in [ROOT.GetCharacter.GetHerHis] ear. The name that left the ear and entered the world was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_08:0 "Oak-Breaker"
 nick_kns_axe_08_desc:0 "A palisade thought it was a forest. [ROOT.GetCharacter.GetFirstNameNoTooltip] reminded it that men invented axes. The gap was called [ROOT.GetCharacter.GetNicknameNoTooltip]'s gate."
 nick_kns_axe_09:0 "the Red Helve"
 nick_kns_axe_09_desc:0 "Sweat and other things darkened the haft. Pages were told not to ask why the knight was called [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_10:0 "Crow-Beak"
 nick_kns_axe_10_desc:0 "The beard of the axe found the eye-slit more often than chance allows. Archers ceded the name [ROOT.GetCharacter.GetNicknameNoTooltip] with respect."
 nick_kns_axe_11:0 "the Huscarl"
 nick_kns_axe_11_desc:0 "A foreign court hired [ROOT.GetCharacter.GetFirstNameNoTooltip] and then could not afford [ROOT.GetCharacter.GetHerHim] in any sense. They wrote [ROOT.GetCharacter.GetNicknameNoTooltip] on the payment roll and prayed."
 nick_kns_axe_12:0 "Thing-Settler"
 nick_kns_axe_12_desc:0 "A feud went to the assembly and left on a stretcher. Lawspeakers used [ROOT.GetCharacter.GetNicknameNoTooltip] when they meant a verdict that bleeds."
 nick_kns_axe_13:0 "the Boarding Axe"
 nick_kns_axe_13_desc:0 "A deck, a rope, a man overboard who never hit water alive. Sailors are quick with names. They chose [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_14:0 "Mail-Hook"
 nick_kns_axe_14_desc:0 "Rings caught; men followed the rings to the ground. Armorers cursed. The curse became [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_15:0 "the Winter Axe"
 nick_kns_axe_15_desc:0 "Frozen wood splits clean. So did the war. [ROOT.GetCharacter.GetFirstNameNoTooltip] came through a January campaign and the name [ROOT.GetCharacter.GetNicknameNoTooltip] steamed in the cold."
 nick_kns_axe_16:0 "Grave-Wedge"
 nick_kns_axe_16_desc:0 "Burying parties asked for [ROOT.GetCharacter.GetFirstNameNoTooltip] by the name [ROOT.GetCharacter.GetNicknameNoTooltip], because the ground was already prepared."
 nick_kns_axe_17:0 "the Boar"
 nick_kns_axe_17_desc:0 "A charge that should have been cavalry was [ROOT.GetCharacter.GetFirstNameNoTooltip] on foot with an axe. Horsemen still tell it, and they use [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_18:0 "Sail-Ripper"
 nick_kns_axe_18_desc:0 "Canvas, then flesh. A cog changed owners in an hour. The old owner's last word was not a prayer. It was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_19:0 "the Monk-Maker"
 nick_kns_axe_19_desc:0 "A tonsure applied the hard way. Dark, but the infantry has a dark sense of humor. They saluted [ROOT.GetCharacter.GetFirstNameNoTooltip] as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_20:0 "Iron Crescent"
 nick_kns_axe_20_desc:0 "The beard caught a sword and kept it. Duelists stopped bringing swords. The story named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_21:0 "the Tide-Axe"
 nick_kns_axe_21_desc:0 "A beach fight when the water came in over the dying. [ROOT.GetCharacter.GetFirstNameNoTooltip] was still swinging when the foam turned pink. Coastal folk said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_22:0 "Perun's Tooth"
 nick_kns_axe_22_desc:0 "Thunder on a clear day, or so the frightened swore. The axe was real enough. The name [ROOT.GetCharacter.GetNicknameNoTooltip] did the rest."
 nick_kns_axe_23:0 "the Varangian"
 nick_kns_axe_23_desc:0 "An emperor borrowed [ROOT.GetCharacter.GetFirstNameNoTooltip] and returned [ROOT.GetCharacter.GetHerHim] with a title [ROOT.GetCharacter.GetSheHe] did not ask for. The north already had one: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_24:0 "Ring-Hewer"
 nick_kns_axe_24_desc:0 "Payment, marriage, mail: all rings, all opened. A skald packed it into [ROOT.GetCharacter.GetNicknameNoTooltip] and the hall stamped."
 nick_kns_axe_25:0 "the Crooked Saint"
 nick_kns_axe_25_desc:0 "An axe taken from a chapel wall and put to honest work. The abbot wanted it back. The realm wanted [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_26:0 "Night-Cleaver"
 nick_kns_axe_26_desc:0 "No horn, no torch, only the sound of wood and bone. A sleeping camp learned the name [ROOT.GetCharacter.GetNicknameNoTooltip] by losing the chance to scream."
 nick_kns_axe_27:0 "Wolf-Jaw"
 nick_kns_axe_27_desc:0 "Two bits, one intention. Hounds would not go near [ROOT.GetCharacter.GetFirstNameNoTooltip] after a certain battle. Hunters nodded and said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_28:0 "the Stave-Breaker"
 nick_kns_axe_28_desc:0 "Spearmen lost their trade around [ROOT.GetCharacter.GetFirstNameNoTooltip]. Shafts are only trees. Trees fear [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_29:0 "Doom-Hatchet"
 nick_kns_axe_29_desc:0 "Short weapon, short fights. Assassins claimed [ROOT.GetCharacter.GetFirstNameNoTooltip] as kin and were refused. The public still used [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_30:0 "the Red Bill"
 nick_kns_axe_30_desc:0 "A long axe at a bridge. Tolls were not collected that day. The ferryman, who lived, named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_31:0 "Hearth-Hewer"
 nick_kns_axe_31_desc:0 "A tyrant died in his kitchen. The axe had been used to split kindling an hour before. Servants, practical, said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_32:0 "the Silent Stroke"
 nick_kns_axe_32_desc:0 "One blow, no speech. Recruits were told the quiet ones are [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_33:0 "Linden-Eater"
 nick_kns_axe_33_desc:0 "Shields went first, always. A woodcutter in the levy started [ROOT.GetCharacter.GetNicknameNoTooltip] as a professional compliment."
 nick_kns_axe_34:0 "the Oath-Axe"
 nick_kns_axe_34_desc:0 "Sworn on the haft, paid on the head. Contract-breakers learned to read. The illiterate died knowing [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_35:0 "Barley-Reaper"
 nick_kns_axe_35_desc:0 "A war in harvest. [ROOT.GetCharacter.GetFirstNameNoTooltip] reaped something else. Farmers crossed themselves and used the name [ROOT.GetCharacter.GetNicknameNoTooltip] in the same breath as weather."
 nick_kns_axe_36:0 "the Black Beard"
 nick_kns_axe_36_desc:0 "Not the face: the axe. Pitch and use made it so. Heraldry caught up and wrote [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_37:0 "Ford-Hewer"
 nick_kns_axe_37_desc:0 "Whoever held the crossing held the war. [ROOT.GetCharacter.GetFirstNameNoTooltip] held the crossing. Maps grew a little mark called [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_38:0 "the Hall-Guest"
 nick_kns_axe_38_desc:0 "An axe at a wedding that had been a trap. The bride lived. The groom's kin named the guest [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_39:0 "Raven-Helve"
 nick_kns_axe_39_desc:0 "Birds sat on the upright axe when the field went still. Scavengers are good witnesses. They testified to [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_40:0 "the Unburied"
 nick_kns_axe_40_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] left enemies where they fell as a kind of writing. Travelers read it and pronounced the word [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_41:0 "God-Wedge"
 nick_kns_axe_41_desc:0 "A missionary war. Conversion and cleavage got confused. The confused coined [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_42:0 "the Last Tree"
 nick_kns_axe_42_desc:0 "A sacred oak came down, and then the men who worshipped it. Chroniclers blamed [ROOT.GetCharacter.GetFirstNameNoTooltip] and titled [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_43:0 "Soot-Axe"
 nick_kns_axe_43_desc:0 "A burnt manor, a clean justice. The soot never came out of the grain. The name [ROOT.GetCharacter.GetNicknameNoTooltip] never came out of the shire."
 nick_kns_axe_44:0 "the Hooked Law"
 nick_kns_axe_44_desc:0 "Sheriffs hired [ROOT.GetCharacter.GetFirstNameNoTooltip] when writs failed. Failure became rare. Docket-books show the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_45:0 "Blood-Adze"
 nick_kns_axe_45_desc:0 "Shaped for timber, used on the living oak of a shield-wall. Carpenters in the host were proud and ashamed. They said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_46:0 "the Sea-Axe"
 nick_kns_axe_46_desc:0 "Salt in the wound of a coastline. [ROOT.GetCharacter.GetFirstNameNoTooltip] made pirates into an example. Widows of pirates have a different name; sailors say [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_47:0 "Kin-Hewer"
 nick_kns_axe_47_desc:0 "A family that would not stop killing its own met [ROOT.GetCharacter.GetFirstNameNoTooltip]. Genealogy became simpler. The simplified called [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_48:0 "the Pale Haft"
 nick_kns_axe_48_desc:0 "White wood that would not take stain, though it should have. Superstition did the naming: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_49:0 "Gate-Tooth"
 nick_kns_axe_49_desc:0 "A portcullis rose for no good reason except fear. The reason had an axe and a name: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_50:0 "the Tithe Axe"
 nick_kns_axe_50_desc:0 "The church took sheaves; [ROOT.GetCharacter.GetFirstNameNoTooltip] took a corrupt cellarer. Both collections were called due. Only one earned [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_51:0 "Cinder-Beard"
 nick_kns_axe_51_desc:0 "The axe came out of a fire still true. Smiths wanted the secret. Soldiers wanted [ROOT.GetCharacter.GetNicknameNoTooltip] on their side."
 nick_kns_axe_52:0 "the Quiet Helve"
 nick_kns_axe_52_desc:0 "No war-rattle. A wrapped haft. The first sound was the last. Night-guards invented [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_53:0 "Boar-Tusk"
 nick_kns_axe_53_desc:0 "A hooked cut that ruined a horse and saved a line. Cavalry, grudging, offered the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_54:0 "the Third Blow"
 nick_kns_axe_54_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] never needed a fourth. Betting men in camp went broke and bitter, and popularized [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_55:0 "Ash-Hewer"
 nick_kns_axe_55_desc:0 "Spear-ash, hall-ash, the ash of a pyre. [ROOT.GetCharacter.GetFirstNameNoTooltip] dealt in all three. The compact name was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_56:0 "the Crooked Bill"
 nick_kns_axe_56_desc:0 "A weapon that went around shields the way a rumor goes around truth. The rumor was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_57:0 "Winter-Bit"
 nick_kns_axe_57_desc:0 "It bit as if the iron were hungrier in the cold. Frostbite and [ROOT.GetCharacter.GetFirstNameNoTooltip] arrived together. Villages said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_58:0 "the Open Roof"
 nick_kns_axe_58_desc:0 "A keep lost its gate-house. Rain came in, and [ROOT.GetCharacter.GetFirstNameNoTooltip] after the rain. The masons' name for the hole was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_59:0 "Saint-Splitter"
 nick_kns_axe_59_desc:0 "An idol and a tyrant in the same afternoon. Mission and murder shared a tool. The tool's master became [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_60:0 "the Red Crossing"
 nick_kns_axe_60_desc:0 "A river named for the day, a knight named for the river. Bards only had to write [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_61:0 "Hound-Axe"
 nick_kns_axe_61_desc:0 "It pulled men down and would not let go. Kennel-keepers recognized the habit and donated the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_62:0 "the Unasked Axe"
 nick_kns_axe_62_desc:0 "Towns that did not send for help still got [ROOT.GetCharacter.GetFirstNameNoTooltip]. Some were grateful. All used [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_63:0 "Penny-Hewer"
 nick_kns_axe_63_desc:0 "Cheap soldiers, expensive deaths. [ROOT.GetCharacter.GetFirstNameNoTooltip] made the arithmetic work. Pay-chests remember [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_64:0 "the Closed Rank"
 nick_kns_axe_64_desc:0 "A wall of men opened because [ROOT.GetCharacter.GetFirstNameNoTooltip] asked with iron. Drill-masters now shout the name [ROOT.GetCharacter.GetNicknameNoTooltip] as a warning."
 nick_kns_axe_65:0 "Ridge-Axe"
 nick_kns_axe_65_desc:0 "High ground, low sun, one climb. [ROOT.GetCharacter.GetFirstNameNoTooltip] kept the crest. Shepherd-boys point and say [ROOT.GetCharacter.GetNicknameNoTooltip] slept there."
 nick_kns_axe_66:0 "the Black Toll"
 nick_kns_axe_66_desc:0 "A bridge, a chain, a robber-knight. The chain is gone. The story stays: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_67:0 "Wattle-Cutter"
 nick_kns_axe_67_desc:0 "Peasant walls, then kings' walls. The skill scaled. So did the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_68:0 "the Last Forest"
 nick_kns_axe_68_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] fought a war among trees until there were fewer trees and fewer enemies. Charcoal-burners coined [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_69:0 "Oath-Hook"
 nick_kns_axe_69_desc:0 "A handshake ended in a scream. False friends stopped offering hands. They offered the name [ROOT.GetCharacter.GetNicknameNoTooltip] instead."
 nick_kns_axe_70:0 "the Pale Bill"
 nick_kns_axe_70_desc:0 "Whitewashed wood, dark work. A procession saw it and misread it as holy. The correction was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_71:0 "Mire-Axe"
 nick_kns_axe_71_desc:0 "Stuck horses, unstuck men. [ROOT.GetCharacter.GetFirstNameNoTooltip] moved in the slough as if it were a floor. The slough's new name was [ROOT.GetCharacter.GetNicknameNoTooltip]'s road."
 nick_kns_axe_72:0 "the Debt Helve"
 nick_kns_axe_72_desc:0 "Borrowed axe, repaid in a dynasty's worth of fear. Creditors considered themselves paid. Debtors said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_73:0 "Horn-Hewer"
 nick_kns_axe_73_desc:0 "A blast cut short, along with the blower. Signals failed. The failure's author was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_74:0 "the Empty Hook"
 nick_kns_axe_74_desc:0 "After the campaign the beard of the axe held a scrap of a banner and nothing else. Heralds filed it under [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_75:0 "Sable Helve"
 nick_kns_axe_75_desc:0 "Dark wood for a dark five years. [ROOT.GetCharacter.GetFirstNameNoTooltip] did not decorate it. The world decorated [ROOT.GetCharacter.GetHerHim] with [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_76:0 "the Cut Tithe"
 nick_kns_axe_76_desc:0 "Half a harvest gone to soldiers, half a lord gone to judgment. Rural deans muttered [ROOT.GetCharacter.GetNicknameNoTooltip] over their ale."
 nick_kns_axe_77:0 "Stone-Beard"
 nick_kns_axe_77_desc:0 "Sparks on a barbican. The stone lost. Watchmen on other walls were told to fear [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_78:0 "the Unsmiling Axe"
 nick_kns_axe_78_desc:0 "A joke died, then a jester, then a custom of laughing near [ROOT.GetCharacter.GetFirstNameNoTooltip]. The remaining custom was to say [ROOT.GetCharacter.GetNicknameNoTooltip] softly."
 nick_kns_axe_79:0 "River-Hewer"
 nick_kns_axe_79_desc:0 "Rafts, chains, a crossing denied. [ROOT.GetCharacter.GetFirstNameNoTooltip] denied the denial. Boatmen rechristened the stretch [ROOT.GetCharacter.GetNicknameNoTooltip]'s water."
 nick_kns_axe_80:0 "the Bone Gate"
 nick_kns_axe_80_desc:0 "A breach stacked with the men who had held it. Later captains used the place-name [ROOT.GetCharacter.GetNicknameNoTooltip] as a lesson."
 nick_kns_axe_81:0 "Frost-Helve"
 nick_kns_axe_81_desc:0 "The haft cracked other men's hands with cold and never [ROOT.GetCharacter.GetHerHis]. Superstition is a kind of medal. It read [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_82:0 "the Quiet Bill"
 nick_kns_axe_82_desc:0 "Wrapped edge, unwrapped result. A night-scalade and a new word on the wind: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_83:0 "Crow's Due"
 nick_kns_axe_83_desc:0 "The birds were fed without [ROOT.GetCharacter.GetFirstNameNoTooltip] lifting extra a finger. Nature and war agreed on [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_84:0 "the Third Gate"
 nick_kns_axe_84_desc:0 "Two assaults failed. [ROOT.GetCharacter.GetFirstNameNoTooltip] did not attend those. The third is the one in the songs, and the songs say [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_85:0 "Briar-Axe"
 nick_kns_axe_85_desc:0 "A retreat that was all thorn and blood. [ROOT.GetCharacter.GetFirstNameNoTooltip] widened it. Pursuers named the path [ROOT.GetCharacter.GetNicknameNoTooltip] and would not take it again."
 nick_kns_axe_86:0 "the Cold Tithe"
 nick_kns_axe_86_desc:0 "Winter war, lean villages, one less tax-man. The ledger of the poor is oral. It includes [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_87:0 "Whet-Axe"
 nick_kns_axe_87_desc:0 "The sound before battle was stone on iron, regular as a psalm. Chaplains lost that metaphor to [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_88:0 "the Closed Wood"
 nick_kns_axe_88_desc:0 "An ambush meant for [ROOT.GetCharacter.GetFirstNameNoTooltip] became a story about the ambushers. Foresters still will not cut that stand. They call it [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_89:0 "Amen-Hewer"
 nick_kns_axe_89_desc:0 "Prayers ended on the down-stroke. A bishop tried to forbid the name [ROOT.GetCharacter.GetNicknameNoTooltip] and thereby advertised it."
 nick_kns_axe_90:0 "the Low Beam"
 nick_kns_axe_90_desc:0 "A hall-fight where height did not help. [ROOT.GetCharacter.GetFirstNameNoTooltip] made the rafters a lesson. Builders and knights both say [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_91:0 "Salt-Axe"
 nick_kns_axe_91_desc:0 "It never rusted right, as if the sea liked [ROOT.GetCharacter.GetFirstNameNoTooltip]. Wreckers and wardens shared the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_92:0 "the Unpaid Helve"
 nick_kns_axe_92_desc:0 "No bounty taken for a killing everyone wanted. That kind of honesty frightens courts. Courts whispered [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_93:0 "Yew-Hewer"
 nick_kns_axe_93_desc:0 "Bows broken at the stave, then the bowmen. A shame, said the archers, and then they said [ROOT.GetCharacter.GetNicknameNoTooltip] with envy."
 nick_kns_axe_94:0 "the Last Wedge"
 nick_kns_axe_94_desc:0 "When the line was all but split, [ROOT.GetCharacter.GetFirstNameNoTooltip] was the wedge that split the other line instead. Manuals of war now mention [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_95:0 "Pyre-Axe"
 nick_kns_axe_95_desc:0 "Wood for the dead, then wood for the living who made them dead. [ROOT.GetCharacter.GetFirstNameNoTooltip] stacked both. The smoke wrote [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_96:0 "the Narrow Stroke"
 nick_kns_axe_96_desc:0 "No wide swings in the press, only the exact one. Veterans tried to teach it and failed. They settled for telling of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_97:0 "Gallows-Axe"
 nick_kns_axe_97_desc:0 "A hanging interrupted by a better justice. The rope was cut. So was the hangman. The shire's new proverb was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_98:0 "the Pale Crossing"
 nick_kns_axe_98_desc:0 "Fog, a causeway, a banner that went down and came up in [ROOT.GetCharacter.GetHerHis] fist. Marsh-dwellers still bless and curse [ROOT.GetCharacter.GetNicknameNoTooltip] together."
 nick_kns_axe_99:0 "Amen-Axe"
 nick_kns_axe_99_desc:0 "A prayer ended on the down-stroke, and a feud ended with it. Parish bells still miss a beat when someone says [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_axe_100:0 "the Last Helve"
 nick_kns_axe_100_desc:0 "When other weapons split, [ROOT.GetCharacter.GetFirstNameNoTooltip]'s haft did not. Companies that had been spent to the last man still had [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_01:0 "the Hammer"
 nick_kns_hammer_01_desc:0 "No poetry required. After five years of bent plate, even heralds gave up and wrote [ROOT.GetCharacter.GetFirstNameNoTooltip] as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_02:0 "Martel"
 nick_kns_hammer_02_desc:0 "Clerks reached for Charles the Hammer because they had no better comparison. [ROOT.GetCharacter.GetFirstNameNoTooltip] did not correct them. The name [ROOT.GetCharacter.GetNicknameNoTooltip] stood."
 nick_kns_hammer_03:0 "Bell-Tongue"
 nick_kns_hammer_03_desc:0 "Helms rang, then failed. A camp sexton said he knew the pitch. He named it [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_04:0 "Anvil-Ender"
 nick_kns_hammer_04_desc:0 "Armorers wept, then charged double. Their invoices are the first written source for [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_05:0 "Bone-Mill"
 nick_kns_hammer_05_desc:0 "A sound like grinding. Surgeons stopped setting certain limbs. They referred the cases to history, under [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_06:0 "the Smith of War"
 nick_kns_hammer_06_desc:0 "A forge-metaphor that got out of the forge. [ROOT.GetCharacter.GetFirstNameNoTooltip] shaped a battlefield and was clocked in as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_07:0 "Chapel-Knocker"
 nick_kns_hammer_07_desc:0 "A sanctuary door, a siege, a bad priest. The door learned a new knock. The town learned [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_08:0 "Crow-Hammer"
 nick_kns_hammer_08_desc:0 "Beak and blunt, bird and body. Scavengers attended [ROOT.GetCharacter.GetHerHis] fights as if paid. The attendance sheet said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_09:0 "Oath-Peen"
 nick_kns_hammer_09_desc:0 "A treaty nailed to oak, then the men who broke it nailed to rumor. The rumor was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_10:0 "Ice-Maul"
 nick_kns_hammer_10_desc:0 "A frozen river, a crossing on foot, horses screaming elsewhere. The ice remembered [ROOT.GetCharacter.GetFirstNameNoTooltip] as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_11:0 "Gate-Tooth"
 nick_kns_hammer_11_desc:0 "Hinges are only opinions. [ROOT.GetCharacter.GetFirstNameNoTooltip] offered a better one. Porters passed down the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_12:0 "Rider's End"
 nick_kns_hammer_12_desc:0 "A pull, a fall, a hoof in the air. Cavalry toasts became shorter. They ended with [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_13:0 "Black-Peen"
 nick_kns_hammer_13_desc:0 "No polish, no mercy. A squire was beaten for trying to shine it. The beating taught the household [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_14:0 "the Waker"
 nick_kns_hammer_14_desc:0 "Sleepers rose to a sound like judgment and did not lie down by choice. Night-camps used [ROOT.GetCharacter.GetNicknameNoTooltip] as a curse and a prayer."
 nick_kns_hammer_15:0 "Ford-Hammer"
 nick_kns_hammer_15_desc:0 "Water to the knee, death to the hip. [ROOT.GetCharacter.GetFirstNameNoTooltip] held the middle. Fishermen still avoid that standing and call it [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_16:0 "Monk-Bell"
 nick_kns_hammer_16_desc:0 "A two-handed swing that called men to a church they would not leave. Brothers of a nearby house wrote [ROOT.GetCharacter.GetNicknameNoTooltip] in their annals."
 nick_kns_hammer_17:0 "Nail-God"
 nick_kns_hammer_17_desc:0 "Posts, doors, men: all receive the point. A blasphemous carpenter offered the name [ROOT.GetCharacter.GetNicknameNoTooltip] and lived to hear it sung."
 nick_kns_hammer_18:0 "Storm-Mallet"
 nick_kns_hammer_18_desc:0 "Rain so hard that bows failed. [ROOT.GetCharacter.GetFirstNameNoTooltip] did not need a bow. The weather report became a legend: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_19:0 "Grave-Maul"
 nick_kns_hammer_19_desc:0 "It packed earth and emptied saddles. Burial details requested [ROOT.GetCharacter.GetFirstNameNoTooltip] by saying [ROOT.GetCharacter.GetNicknameNoTooltip] as if it were a tool-mark."
 nick_kns_hammer_20:0 "Helm-Singer"
 nick_kns_hammer_20_desc:0 "A music no one requested. Minstrels, jealous, still borrowed the line and the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_21:0 "the Mason"
 nick_kns_hammer_21_desc:0 "Walls and men yield to patience. [ROOT.GetCharacter.GetFirstNameNoTooltip] was patient for five years. Guilds and armies both claimed [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_22:0 "Red-Star"
 nick_kns_hammer_22_desc:0 "Flanges in a star that did not stay clean. Heraldry painted it, then regretted the red. The regret was named [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_23:0 "Winter-Weight"
 nick_kns_hammer_23_desc:0 "Heavy gear, heavier blows, a campaign that starved horses. [ROOT.GetCharacter.GetFirstNameNoTooltip] did not starve the war. They packed the name [ROOT.GetCharacter.GetNicknameNoTooltip] in the wagons."
 nick_kns_hammer_24:0 "Law-Hammer"
 nick_kns_hammer_24_desc:0 "A court that could not sit sent [ROOT.GetCharacter.GetFirstNameNoTooltip] instead. Precedents now include [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_25:0 "Boar-Maul"
 nick_kns_hammer_25_desc:0 "In the press, short and filthy. Boar-hunters recognized the style and donated [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_26:0 "Ash-Breaker"
 nick_kns_hammer_26_desc:0 "Spear-walls became kindling. Pikemen retrained or retired. Their complaint was catalogued as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_27:0 "the Crooked Saint"
 nick_kns_hammer_27_desc:0 "Taken from a chapel, never returned, frequently justified. Relics have owners. This one had [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_28:0 "Iron Gospel"
 nick_kns_hammer_28_desc:0 "Preached on crowns. A bishop tried to claim the metaphor and lost it to the infantry's [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_29:0 "Last Forge"
 nick_kns_hammer_29_desc:0 "If you met [ROOT.GetCharacter.GetFirstNameNoTooltip], you had reached the end of repair. Smiths used [ROOT.GetCharacter.GetNicknameNoTooltip] as shop-talk for a total loss."
 nick_kns_hammer_30:0 "the Quiet Maul"
 nick_kns_hammer_30_desc:0 "Wrapped head, unwrapped verdict. A night-gate and a new hush in the stories: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_31:0 "Saint Eloi's Debt"
 nick_kns_hammer_31_desc:0 "The smith-saint was owed a candle. [ROOT.GetCharacter.GetFirstNameNoTooltip] paid in scrap. Guild-chapels still mention [ROOT.GetCharacter.GetNicknameNoTooltip] when they joke."
 nick_kns_hammer_32:0 "the Third Stroke"
 nick_kns_hammer_32_desc:0 "Bets on two were for fools. Camp gambling standardized on [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_33:0 "Ridge-Maul"
 nick_kns_hammer_33_desc:0 "A hill, a hammer, a change of ownership. Shepherds still will not graze the crest they call [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_34:0 "the Black Toll"
 nick_kns_hammer_34_desc:0 "A chain across a road, a knight across the chain. Tolls went out of fashion. The fashion was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_35:0 "Hearth-Peen"
 nick_kns_hammer_35_desc:0 "A killing in a kitchen that ended a famine of justice. Cooks are the first historians. They served up [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_36:0 "the Unasked Hammer"
 nick_kns_hammer_36_desc:0 "Sieges [ROOT.GetCharacter.GetFirstNameNoTooltip] was not hired for still ended. Accountants invented a line-item and a curse: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_37:0 "Penny-Maul"
 nick_kns_hammer_37_desc:0 "Cheap iron, dear results. Quartermasters loved and feared the ledger-name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_38:0 "the Closed Helm"
 nick_kns_hammer_38_desc:0 "Once shut, it did not open on a face anyone knew. Armorers issued a warning tag that read [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_39:0 "Soot-Hammer"
 nick_kns_hammer_39_desc:0 "A burnt keep, a clean succession. The soot on the head was left as a signature. The signature was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_40:0 "the Pale Weight"
 nick_kns_hammer_40_desc:0 "White bindings on a dark head. Processions mistook it. Funerals did not. Both used [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_41:0 "Mire-Maul"
 nick_kns_hammer_41_desc:0 "Mud that stopped cavalry did not stop [ROOT.GetCharacter.GetFirstNameNoTooltip]. The bog has a firm place in it now, called [ROOT.GetCharacter.GetNicknameNoTooltip]'s step."
 nick_kns_hammer_42:0 "Oath-Weight"
 nick_kns_hammer_42_desc:0 "Sworn on the hammer, which is an honest altar. Perjurers avoided that chapel. The parish named it after [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_43:0 "the Empty Anvil"
 nick_kns_hammer_43_desc:0 "No smith left in a town that had seen [ROOT.GetCharacter.GetFirstNameNoTooltip] work. They hung the shop-sign anyway. It said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_44:0 "Crow's Peen"
 nick_kns_hammer_44_desc:0 "Birds came early. Watchers on walls learned to count crows and say [ROOT.GetCharacter.GetNicknameNoTooltip] when the count jumped."
 nick_kns_hammer_45:0 "the Red Beam"
 nick_kns_hammer_45_desc:0 "A hall-fight, a cracked timber, a lord on the floor. Builders still tap that beam and tell of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_46:0 "Frost-Maul"
 nick_kns_hammer_46_desc:0 "Iron so cold it burned. Men dropped swords and kept dying. The weather and the knight shared the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_47:0 "the Tithe Hammer"
 nick_kns_hammer_47_desc:0 "A cellarer who starved a village met a different hunger. Tithe-barns paint a small hammer and do not explain. The explanation is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_48:0 "Horn-Peen"
 nick_kns_hammer_48_desc:0 "A rally that became a silence. Signalers train with the story of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_49:0 "the Last Bell"
 nick_kns_hammer_49_desc:0 "When the chapel bell was broken, [ROOT.GetCharacter.GetFirstNameNoTooltip] provided the hour. Timekeeping became a legend named [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_50:0 "Sable Weight"
 nick_kns_hammer_50_desc:0 "Dark bindings, dark years. [ROOT.GetCharacter.GetFirstNameNoTooltip] did not lighten either. Mourning-houses used [ROOT.GetCharacter.GetNicknameNoTooltip] as if it were a psalm."
 nick_kns_hammer_51:0 "the Cut Peace"
 nick_kns_hammer_51_desc:0 "Talks, a hidden knife, a hammer that was not hidden. Envoys write [ROOT.GetCharacter.GetNicknameNoTooltip] in the margin where treaties fail."
 nick_kns_hammer_52:0 "Stone-Singer"
 nick_kns_hammer_52_desc:0 "Masonry rang. Then it opened. Guild secrets now include a warning about [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_53:0 "the Unpaid Weight"
 nick_kns_hammer_53_desc:0 "No purse taken for a necessary death. Bribes went out of style in that county. The style was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_54:0 "Yew-Breaker"
 nick_kns_hammer_54_desc:0 "Bows, then bowmen, then the tree-line. Forest law never covered this. Foresters still say [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_55:0 "the Narrow Stroke"
 nick_kns_hammer_55_desc:0 "No wasted swing in a street-fight that decided a succession. Alleys remember [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_56:0 "Gallows-Peen"
 nick_kns_hammer_56_desc:0 "A scaffold reused as an anvil of law. The town took down the gallows and kept the story [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_57:0 "the Pale Ford"
 nick_kns_hammer_57_desc:0 "Mist, hammer-blows like a far smithy, a crossing won. Ferrymen charge extra to tell of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_58:0 "Amen-Maul"
 nick_kns_hammer_58_desc:0 "A benediction cut off, then a war cut off. Deacons slip and say [ROOT.GetCharacter.GetNicknameNoTooltip] when they mean enough."
 nick_kns_hammer_59:0 "the Low Anvil"
 nick_kns_hammer_59_desc:0 "Kneeling men, falling men. A fight in a crypt. The dead gained company and a caretaker named [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_60:0 "Salt-Hammer"
 nick_kns_hammer_60_desc:0 "A harbor chain smashed, a fleet embarrassed. Salt air keeps the tale of [ROOT.GetCharacter.GetNicknameNoTooltip] as well as it keeps rust."
 nick_kns_hammer_61:0 "the Third Gate"
 nick_kns_hammer_61_desc:0 "Two rams failed. [ROOT.GetCharacter.GetFirstNameNoTooltip] walked up as if doors were a rumor. The third gate is a proverb: send [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_62:0 "Briar-Maul"
 nick_kns_hammer_62_desc:0 "A pursuit through thorn that should have stopped cavalry and did stop everyone but [ROOT.GetCharacter.GetFirstNameNoTooltip]. The scratches spelled [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_63:0 "the Cold Gospel"
 nick_kns_hammer_63_desc:0 "No relics, only dents. A relic-seller left town. Doctrine simplified to [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_64:0 "Whet-Peen"
 nick_kns_hammer_64_desc:0 "The ritual before battle was not prayer. It was the stone. Camps still listen for it and murmur [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_65:0 "the Closed Chapel"
 nick_kns_hammer_65_desc:0 "Doors barred from inside, opened from outside anyway. Confessors use [ROOT.GetCharacter.GetNicknameNoTooltip] when they mean no sanctuary."
 nick_kns_hammer_66:0 "River-Weight"
 nick_kns_hammer_66_desc:0 "Bodies and hammers have the same opinion of currents. The weir is named for [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_67:0 "the Bone Door"
 nick_kns_hammer_67_desc:0 "A breach filled, then emptied, then named. Captains point at the gap and say that is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_68:0 "Pyre-Peen"
 nick_kns_hammer_68_desc:0 "Nails for the pyre, then nails in the argument. Smoke and [ROOT.GetCharacter.GetFirstNameNoTooltip] left together. The wind carried [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_69:0 "the Unsmiling Weight"
 nick_kns_hammer_69_desc:0 "A feast, a challenge, a quiet answer. Jesters avoid that household. The household toast is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_70:0 "Cinder-Maul"
 nick_kns_hammer_70_desc:0 "Pulled from a wrecked forge and put to a wrecked keep. Smith and siege merged in the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_71:0 "the Debt Weight"
 nick_kns_hammer_71_desc:0 "A borrowed hammer, a repaid blood-line. Ledgers of that house end in [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_72:0 "Wolf-Peen"
 nick_kns_hammer_72_desc:0 "It pulled men down and worried them. Kennels went silent when [ROOT.GetCharacter.GetFirstNameNoTooltip] passed. Kennel-men said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_73:0 "the Open Roof"
 nick_kns_hammer_73_desc:0 "A tower lost its top. Rain and ravens moved in. The architect of the sky-hole was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_74:0 "Saint-Breaker"
 nick_kns_hammer_74_desc:0 "An idol of a bad saint, then the men who sold him. Iconoclasm got a mascot: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_75:0 "the Red Crossing"
 nick_kns_hammer_75_desc:0 "A bridge the color of its day. Children skip and chant [ROOT.GetCharacter.GetNicknameNoTooltip] without knowing why. Their grandparents know."
 nick_kns_hammer_76:0 "Hound-Maul"
 nick_kns_hammer_76_desc:0 "It hunted in packs of one. Trackers admitted they were junior and used the senior name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_77:0 "the Quiet Bell"
 nick_kns_hammer_77_desc:0 "One note, then a town under new management. Bell-founders tell the joke carefully. The punchline is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_78:0 "Winter-Peen"
 nick_kns_hammer_78_desc:0 "The head held frost like a relic. Men who touched it without leave lost skin and certainty. They gained [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_79:0 "the Tithe Weight"
 nick_kns_hammer_79_desc:0 "Barns opened. A lock did not last. Starving parishes painted a hammer on their doors and meant [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_80:0 "the Empty Saddle"
 nick_kns_hammer_80_desc:0 "A famous destrier came home alone. Stables are superstitious. They hung a shoe for [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_81:0 "Soot-Bell"
 nick_kns_hammer_81_desc:0 "A burnt belfry, a new hour. Time in that town starts from [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_82:0 "the Last Gospel"
 nick_kns_hammer_82_desc:0 "A field-mass interrupted by a charge [ROOT.GetCharacter.GetFirstNameNoTooltip] ended. The missal in the chaplain's wagon has [ROOT.GetCharacter.GetNicknameNoTooltip] in the margin."
 nick_kns_hammer_83:0 "Iron Evensong"
 nick_kns_hammer_83_desc:0 "Blows at dusk, regular as a choir. Monks in a nearby house changed their tune and their stories to include [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_84:0 "the Unasked Weight"
 nick_kns_hammer_84_desc:0 "Allies received help they feared to request. Gratitude and dread braided into [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_85:0 "Penny-Peen"
 nick_kns_hammer_85_desc:0 "A cheap killing of an expensive tyrant. Markets reopened. Market-crosses still get a tap for [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_86:0 "the Closed Rank"
 nick_kns_hammer_86_desc:0 "A shield-wall learned it was not a wall. Drill changed. The old drill is remembered as before [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_87:0 "Ridge-Peen"
 nick_kns_hammer_87_desc:0 "Downhill is easy. [ROOT.GetCharacter.GetFirstNameNoTooltip] went up. The cairn on top is not a saint's. It is [ROOT.GetCharacter.GetNicknameNoTooltip]'s."
 nick_kns_hammer_88:0 "the Black Beam"
 nick_kns_hammer_88_desc:0 "A charred hall-beam kept as a relic of a judgment. Pilgrims are confused. Locals say [ROOT.GetCharacter.GetNicknameNoTooltip] and shrug."
 nick_kns_hammer_89:0 "Frost-Bell"
 nick_kns_hammer_89_desc:0 "Ice in the flanges, a sound like glass. A winter war got its own carol, badly sung, named [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_90:0 "the Cut Tithe"
 nick_kns_hammer_90_desc:0 "Half to the poor, half to the grave. Reeve's accounts are blunt. The blunt line is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_91:0 "Stone-Weight"
 nick_kns_hammer_91_desc:0 "It treated men as if they were poorly laid courses. Masons, professionally offended and impressed, said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_92:0 "the Unpaid Bell"
 nick_kns_hammer_92_desc:0 "No bounty, no pardon-price. The town collected a name instead: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_93:0 "Yew-Peen"
 nick_kns_hammer_93_desc:0 "A circle of bowmen became a circle of kindling and quiet. Archery contests in that shire still handicap [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_94:0 "the Third Stroke"
 nick_kns_hammer_94_desc:0 "One to the shield, one to the helm, one to the future. Instructors count it off and name the future [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_95:0 "Amen-Weight"
 nick_kns_hammer_95_desc:0 "Enough, said the hammer. Congregations flinch at the word and remember [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_96:0 "the Low Gospel"
 nick_kns_hammer_96_desc:0 "A crypt, a conspiracy, a sudden honest noise. The dead kept the secret. The living kept [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_97:0 "Salt-Peen"
 nick_kns_hammer_97_desc:0 "A chain-boom broken, a tax on salt broken with it. Cooks bless [ROOT.GetCharacter.GetNicknameNoTooltip] without knowing the battle's date."
 nick_kns_hammer_98:0 "the Last Anvil"
 nick_kns_hammer_98_desc:0 "After [ROOT.GetCharacter.GetFirstNameNoTooltip] left a county, smiths had less repair and more funeral-iron. They called that season [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_hammer_99:0 "Amen-Hammer"
 nick_kns_hammer_99_desc:0 "The last word in a chapel was not spoken. It was struck. After that the village used [ROOT.GetCharacter.GetNicknameNoTooltip] the way other villages use amen."
 nick_kns_hammer_100:0 "the Empty Forge"
 nick_kns_hammer_100_desc:0 "Bellows went still because there was nothing left worth mending. Smiths boarded the door and chalked [ROOT.GetCharacter.GetNicknameNoTooltip] on the plank."
 nick_kns_mace_01:0 "the Mace"
 nick_kns_mace_01_desc:0 "Blunt names for blunt work. After five years even enemies stopped reaching for poetry and said [ROOT.GetCharacter.GetFirstNameNoTooltip] was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_02:0 "Odo's Right"
 nick_kns_mace_02_desc:0 "A clerk reminded the host that a mace sheds no blood in theory. The field disagreed in practice. Theory named [ROOT.GetCharacter.GetHerHim] [ROOT.GetCharacter.GetNicknameNoTooltip] anyway."
 nick_kns_mace_03:0 "Morning Star"
 nick_kns_mace_03_desc:0 "Spikes at dawn over a fallen camp. Survivors saw the sky and the weapon and chose the same words: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_04:0 "Crown-Cracker"
 nick_kns_mace_04_desc:0 "A circlet is only a thin helm. [ROOT.GetCharacter.GetFirstNameNoTooltip] demonstrated. Jewelers and heralds jointly issued the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_05:0 "the Holy Knob"
 nick_kns_mace_05_desc:0 "A priest-knight's tool, used without hypocrisy. The diocese tried to object and then used [ROOT.GetCharacter.GetNicknameNoTooltip] in a letter."
 nick_kns_mace_06:0 "Skull-Orb"
 nick_kns_mace_06_desc:0 "No flanges, no beauty, no doubt. A child's toy in shape, a dynasty in result. Nurses frightened children with [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_07:0 "Flanged Mercy"
 nick_kns_mace_07_desc:0 "Mercy, as in quickly. The flanges wrote it in six copies. Copyists abbreviated to [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_08:0 "the Cantor"
 nick_kns_mace_08_desc:0 "Keeps time. The choir is the dying. A cruel hymn got a title: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_09:0 "Pewter Saint"
 nick_kns_mace_09_desc:0 "Looked like church plate. Behaved like a riot. Sacristans still check their cupboards and swear [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_10:0 "Rood-Mace"
 nick_kns_mace_10_desc:0 "Cross-shaped head, short sermon. Heretics and taxmen learned the homily [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_11:0 "Black Scepter"
 nick_kns_mace_11_desc:0 "Lordship without a land, only a reach. Courts that had mocked a landless knight wrote [ROOT.GetCharacter.GetNicknameNoTooltip] on the plea roll."
 nick_kns_mace_12:0 "the Vineyard"
 nick_kns_mace_12_desc:0 "Purple flanges after the press of battle. Vintners, who know stains, raised a glass to [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_13:0 "Gate-Key"
 nick_kns_mace_13_desc:0 "Locks opened by ceasing to be locks. Turnkeys retired. Their farewell toast was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_14:0 "Pax"
 nick_kns_mace_14_desc:0 "The peace of the suddenly still. Envoys hated the joke and could not stop saying [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_15:0 "the Tithing"
 nick_kns_mace_15_desc:0 "One in ten was not enough for some lords. [ROOT.GetCharacter.GetFirstNameNoTooltip] adjusted the fraction. Parish books show a year of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_16:0 "Iron Psalm"
 nick_kns_mace_16_desc:0 "Cadence on iron, verse on bone. A precentor lost his place for laughing. The laugh was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_17:0 "Bulb of Cain"
 nick_kns_mace_17_desc:0 "Round as an apple, old as the first field. Monks argued scripture and then conceded the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_18:0 "Knuckle-Mass"
 nick_kns_mace_18_desc:0 "Short enough for a saddle, long enough for a duke. Squires measured their courage against stories of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_19:0 "White-Flange"
 nick_kns_mace_19_desc:0 "They polished it once. Never again. The memory of white became the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_20:0 "the Sexton"
 nick_kns_mace_20_desc:0 "Fills graves, borrows the office. A real sexton complained, then admitted [ROOT.GetCharacter.GetFirstNameNoTooltip] did more business. He used [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_21:0 "Reliquary"
 nick_kns_mace_21_desc:0 "Hollow head, once for a bone, now for a reputation. Pilgrims were disappointed. Soldiers were not. They had [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_22:0 "Storm-Knob"
 nick_kns_mace_22_desc:0 "Hail and horns and [ROOT.GetCharacter.GetFirstNameNoTooltip]. Roofs failed first, then ranks. Almanacs of that year mention [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_23:0 "Lawgiver"
 nick_kns_mace_23_desc:0 "A civic mace gone to war and gone native. The town that lost it gained a legend called [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_24:0 "Red Chaplet"
 nick_kns_mace_24_desc:0 "A crown of nails. Processions that year had a new saint they were not supposed to have: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_25:0 "Abbey-Debt"
 nick_kns_mace_25_desc:0 "Plate from a cloister, justice from an unexpected quarter. Abbots still taste metal when they say [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_26:0 "Horseman's Bead"
 nick_kns_mace_26_desc:0 "One bead on a rosary of campaigns. Riders counted and ran out of beads. They started counting [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_27:0 "Quiet Bell"
 nick_kns_mace_27_desc:0 "Soft, then over. A town changed hands between compline and dawn. The bell-rope is still nicknamed [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_28:0 "Basilica"
 nick_kns_mace_28_desc:0 "Doors of a great church, then the men who sold justice there. Architecture critics of the sword-arm said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_29:0 "Nail-Bloom"
 nick_kns_mace_29_desc:0 "A flower no one picked twice. Gardeners in the metaphor business handed [ROOT.GetCharacter.GetFirstNameNoTooltip] the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_30:0 "Winter-Orb"
 nick_kns_mace_30_desc:0 "Cold iron, colder fame. A frost-fair was cancelled for a war. The cancellation notice might as well have read [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_31:0 "the Verdict"
 nick_kns_mace_31_desc:0 "Appeals denied. A hanging judge without a bench. Law students still debate [ROOT.GetCharacter.GetNicknameNoTooltip] as if it were a case."
 nick_kns_mace_32:0 "the Third Flange"
 nick_kns_mace_32_desc:0 "Men said they could take two. They were wrong. Surgeons tagged bodies with a joke that became [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_33:0 "Ridge-Mace"
 nick_kns_mace_33_desc:0 "High ground gained at a walk. The walk is the insult. The name [ROOT.GetCharacter.GetNicknameNoTooltip] is the record."
 nick_kns_mace_34:0 "the Black Toll"
 nick_kns_mace_34_desc:0 "Pay or pray; both failed. A chain came down. So did a profession. Road-wardens toast [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_35:0 "Hearth-Knob"
 nick_kns_mace_35_desc:0 "A fire-lit killing that ended a winter of writs. Kitchen-boys saw it and could not unsee [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_36:0 "the Unasked Mace"
 nick_kns_mace_36_desc:0 "Arrived, resolved, left a silence. Town councils now budget for the possibility of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_37:0 "Penny-Flange"
 nick_kns_mace_37_desc:0 "Inexpensive death for a very expensive man. Markets opened the next morning and priced in [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_38:0 "the Closed Visor"
 nick_kns_mace_38_desc:0 "What was inside did not come out as a face. Helmet-makers added a clause about [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_39:0 "Soot-Mace"
 nick_kns_mace_39_desc:0 "A burnt chancel, a purged chapter. Ash on the flanges was left as annotation. The text was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_40:0 "the Pale Knob"
 nick_kns_mace_40_desc:0 "Wrapped in linen like a relic. Unwrapped like a riot. Processions now go the long way around [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_41:0 "Mire-Flange"
 nick_kns_mace_41_desc:0 "Mud packed the spikes and did not save anyone. The bog road is posted, in folklore, as [ROOT.GetCharacter.GetNicknameNoTooltip]'s lane."
 nick_kns_mace_42:0 "Oath-Orb"
 nick_kns_mace_42_desc:0 "Sworn on, then used on the swearer. Relics blushed, if relics could. Parishes said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_43:0 "the Empty Choir"
 nick_kns_mace_43_desc:0 "A chapter-house meeting ended below the range of song. The stalls are still there. The story is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_44:0 "Crow's Bead"
 nick_kns_mace_44_desc:0 "Birds counted the spikes for men. Watchers learned the count meant [ROOT.GetCharacter.GetNicknameNoTooltip] had passed."
 nick_kns_mace_45:0 "the Red Door"
 nick_kns_mace_45_desc:0 "A smashed portal that stained. Paint could not cover it. They hung a name on it instead: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_46:0 "Frost-Flange"
 nick_kns_mace_46_desc:0 "Ice made the flanges honest. Men dropped shields because the shields hurt more. They remembered [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_47:0 "the Tithe Knob"
 nick_kns_mace_47_desc:0 "Barns, locks, a cellarer's skull. Starvation ended; a story began. The story's title is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_48:0 "Horn-Orb"
 nick_kns_mace_48_desc:0 "A signal died mid-note. The note that replaced it was the name [ROOT.GetCharacter.GetNicknameNoTooltip] shouted down the line."
 nick_kns_mace_49:0 "the Last Mass"
 nick_kns_mace_49_desc:0 "A field altar, a charge, a mace that finished both. Missals in that company have [ROOT.GetCharacter.GetNicknameNoTooltip] beside the ordinary."
 nick_kns_mace_50:0 "Sable Flange"
 nick_kns_mace_50_desc:0 "Dark metal, darker five years. [ROOT.GetCharacter.GetFirstNameNoTooltip] refused gilding. The world gilded [ROOT.GetCharacter.GetHerHim] with [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_51:0 "the Cut Peace"
 nick_kns_mace_51_desc:0 "A kiss of peace, a hidden point, a mace that was not a kiss. Legates record the incident as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_52:0 "Stone-Orb"
 nick_kns_mace_52_desc:0 "It treated helms as poorly chosen pebbles. Slingers, professionally curious, adopted the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_53:0 "the Unpaid Flange"
 nick_kns_mace_53_desc:0 "No blood-price accepted. That ruined a few customs. The ruin is filed under [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_54:0 "Yew-Knob"
 nick_kns_mace_54_desc:0 "A circle of archers learned about radius. Geometry classes in camp are short. They end with [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_55:0 "the Narrow Mass"
 nick_kns_mace_55_desc:0 "A nave-fight, shoulder to shoulder. Wide weapons failed. [ROOT.GetCharacter.GetFirstNameNoTooltip] did not. The churchwardens say [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_56:0 "Gallows-Orb"
 nick_kns_mace_56_desc:0 "The scaffold lost its monopoly. A town charter was rewritten around an afternoon called [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_57:0 "the Pale Chapter"
 nick_kns_mace_57_desc:0 "Canons in white, a ledger in red. [ROOT.GetCharacter.GetFirstNameNoTooltip] closed the book. The next chapter heading is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_58:0 "Amen-Flange"
 nick_kns_mace_58_desc:0 "A word, a blow, a stillness. Choirboys are told not to say it. They say [ROOT.GetCharacter.GetNicknameNoTooltip] anyway."
 nick_kns_mace_59:0 "the Low Relic"
 nick_kns_mace_59_desc:0 "A crypt conspiracy and a sudden relic of quiet. Guides of that church charge extra for [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_60:0 "Salt-Mace"
 nick_kns_mace_60_desc:0 "A custom-house, a cheat, a harbor that suddenly ran fair. Salt-wives bless [ROOT.GetCharacter.GetNicknameNoTooltip] when prices fall."
 nick_kns_mace_61:0 "the Third Door"
 nick_kns_mace_61_desc:0 "Two rams, then a man with a mace who did not need a ram. Sappers feel professionally ill and say [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_62:0 "Briar-Orb"
 nick_kns_mace_62_desc:0 "Spikes plus thorns plus a pursuit. The path closed behind [ROOT.GetCharacter.GetFirstNameNoTooltip]. Maps mark it [ROOT.GetCharacter.GetNicknameNoTooltip] and leave it blank."
 nick_kns_mace_63:0 "the Cold Psalm"
 nick_kns_mace_63_desc:0 "No incense, only iron. A relic-fair packed up early. The early hour is still called [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_64:0 "Whet-Flange"
 nick_kns_mace_64_desc:0 "They do not whet a mace, and still [ROOT.GetCharacter.GetFirstNameNoTooltip] had a ritual sound. That sound means [ROOT.GetCharacter.GetNicknameNoTooltip] in three dialects."
 nick_kns_mace_65:0 "the Closed Poorhouse"
 nick_kns_mace_65_desc:0 "A warden who sold bread met a closed fist of iron. The poorhouse opened. Its saint, unofficially, is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_66:0 "River-Knob"
 nick_kns_mace_66_desc:0 "A weir of men. [ROOT.GetCharacter.GetFirstNameNoTooltip] unmade it. Eelers tell the date by the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_67:0 "the Bone Choir"
 nick_kns_mace_67_desc:0 "A crypt that gained verses. The verses are not sung. They are spoken as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_68:0 "Pyre-Flange"
 nick_kns_mace_68_desc:0 "Fire for the dead, iron for the reason. Smoke made a sign of the cross and of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_69:0 "the Unsmiling Orb"
 nick_kns_mace_69_desc:0 "A feast's end. No encore. The hall's new house-rule is not to mention [ROOT.GetCharacter.GetNicknameNoTooltip] near the wine."
 nick_kns_mace_70:0 "Cinder-Mace"
 nick_kns_mace_70_desc:0 "Found in ash, used to make more. A town charter begins again from the year of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_71:0 "the Debt Orb"
 nick_kns_mace_71_desc:0 "Borrowed from a bishop, repaid in a kind of peace. The bishop's register ends that page with [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_72:0 "Wolf-Flange"
 nick_kns_mace_72_desc:0 "It caught and held. Hounds were offended by the competition. Hunt-masters conceded [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_73:0 "the Open Cloister"
 nick_kns_mace_73_desc:0 "Arcades do not stop a man with a mace and a grievance. Regular canons irregularly remember [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_74:0 "Saint-Breaker"
 nick_kns_mace_74_desc:0 "A fake miracle, a real crowd, a sudden honesty. Calendars lost a saint and gained [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_75:0 "the Red Chapter"
 nick_kns_mace_75_desc:0 "Minutes written in a color the clerk did not choose. The minutes are cited as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_76:0 "Hound-Orb"
 nick_kns_mace_76_desc:0 "Chased men out of a holdfast as if they were deer. Horns were not needed. The horn-call is now [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_77:0 "the Quiet Chapter"
 nick_kns_mace_77_desc:0 "No bell, no vote, a result. Cathedral politics still use [ROOT.GetCharacter.GetNicknameNoTooltip] as the word for sudden consensus."
 nick_kns_mace_78:0 "Winter-Flange"
 nick_kns_mace_78_desc:0 "Ice in the spikes, steam on the breath. A frozen war got a mascot: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_79:0 "the Tithe Orb"
 nick_kns_mace_79_desc:0 "Granaries opened at last. A lock-shaped dent in a door is shown to children as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_80:0 "the Empty Saddle"
 nick_kns_mace_80_desc:0 "A mace is a horseman's friend until it is not. The horse came home. The name [ROOT.GetCharacter.GetNicknameNoTooltip] came with it."
 nick_kns_mace_81:0 "Soot-Orb"
 nick_kns_mace_81_desc:0 "Black from a roof-fight. They did not clean it. Cleanliness would have offended the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_82:0 "the Last Verse"
 nick_kns_mace_82_desc:0 "A hymn ended early. So did a rebellion. Choirmasters tap the lectern and tell of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_83:0 "Iron Compline"
 nick_kns_mace_83_desc:0 "Last office of the day, last office of a few men. Night-offices in that fief are haunted by [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_84:0 "the Unasked Orb"
 nick_kns_mace_84_desc:0 "Help arrived like a bruise: uninvited, unmistakable. Towns put [ROOT.GetCharacter.GetNicknameNoTooltip] in their watch-ordinances."
 nick_kns_mace_85:0 "Penny-Orb"
 nick_kns_mace_85_desc:0 "A cheap head for a costly injustice. Peddlers sell wooden copies and get fined. The fine cites [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_86:0 "the Closed Rank"
 nick_kns_mace_86_desc:0 "Flanges do not care about dressing by the right. Dressing broke. Sergeants still bark [ROOT.GetCharacter.GetNicknameNoTooltip] when the line bows."
 nick_kns_mace_87:0 "Ridge-Orb"
 nick_kns_mace_87_desc:0 "Rolled downhill in a manner of speaking. The manner of speaking is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_88:0 "the Black Pew"
 nick_kns_mace_88_desc:0 "A man died sitting. The pew was retired. Visitors sit elsewhere and ask about [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_89:0 "Frost-Orb"
 nick_kns_mace_89_desc:0 "It stuck to a glove, then to a legend. Winter militia drill with the tale of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_90:0 "the Cut Tithe"
 nick_kns_mace_90_desc:0 "Half returned to the hungry, half denied to a hoarder. Bread-weights in that market are stamped, unofficially, [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_91:0 "Stone-Flange"
 nick_kns_mace_91_desc:0 "Sparks like relics. A wall lost an argument. Masons drink to [ROOT.GetCharacter.GetNicknameNoTooltip] when a contract is ugly."
 nick_kns_mace_92:0 "the Unpaid Orb"
 nick_kns_mace_92_desc:0 "No purse, no pardon. Customary bribes failed as a technology. The replacement technology was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_93:0 "Yew-Flange"
 nick_kns_mace_93_desc:0 "Archers in a yard, then not. The yard is used for hay now. Old men call the hay [ROOT.GetCharacter.GetNicknameNoTooltip]'s crop."
 nick_kns_mace_94:0 "the Third Mass"
 nick_kns_mace_94_desc:0 "Two warnings. Then [ROOT.GetCharacter.GetFirstNameNoTooltip]. Parish registers skip to the burial list headed [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_95:0 "Amen-Orb"
 nick_kns_mace_95_desc:0 "The congregation said it; the mace agreed. Agreement of that kind is remembered as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_96:0 "the Low Choir"
 nick_kns_mace_96_desc:0 "Under-croft, low ceiling, lower motives. The motives stopped. Tour-guides are not allowed to say [ROOT.GetCharacter.GetNicknameNoTooltip] and do."
 nick_kns_mace_97:0 "Salt-Flange"
 nick_kns_mace_97_desc:0 "Customs, corruption, a sudden fair wind. Fishwives pin the weather on [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_98:0 "the Last Scepter"
 nick_kns_mace_98_desc:0 "When lords ran out of badges, [ROOT.GetCharacter.GetFirstNameNoTooltip] was still a badge. Pretenders stopped pretending. They cited [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_99:0 "Amen-Mace"
 nick_kns_mace_99_desc:0 "A congregation finished the word; the mace finished the argument. They still flinch in that nave when someone murmurs [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_mace_100:0 "the Empty See"
 nick_kns_mace_100_desc:0 "A bad bishop's chair sat vacant after a visitation nobody scheduled. Chapter minutes hide the cause under the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_01:0 "the Spear"
 nick_kns_spear_01_desc:0 "Ash and iron and five years. Titles bounced off [ROOT.GetCharacter.GetFirstNameNoTooltip] like rain. What stuck was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_02:0 "the Holy Lance"
 nick_kns_spear_02_desc:0 "Priests argued whether it was the Spear. Soldiers did not argue. They pointed at [ROOT.GetCharacter.GetFirstNameNoTooltip] and said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_03:0 "Longinus"
 nick_kns_spear_03_desc:0 "A chaplain overreached with a comparison. The comparison survived the chaplain's embarrassment as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_04:0 "Rhongomyniad"
 nick_kns_spear_04_desc:0 "A Welsh bard used an old name and would not take it back. Courts of arms shrugged and enrolled [ROOT.GetCharacter.GetFirstNameNoTooltip] as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_05:0 "Boar-Spit"
 nick_kns_spear_05_desc:0 "The hunting field and the war-field used the same motion. Huntsmen offered [ROOT.GetCharacter.GetNicknameNoTooltip] as if it were a hall-name."
 nick_kns_spear_06:0 "Winged Ash"
 nick_kns_spear_06_desc:0 "Lugs like a bird, a wound that held. Surgeons hated the design and honored the designer: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_07:0 "Ford-Reed"
 nick_kns_spear_07_desc:0 "Planted in the water like a plant that kills. The crossing grew a folklore: [ROOT.GetCharacter.GetNicknameNoTooltip]'s reed-bed."
 nick_kns_spear_08:0 "Banner-Tooth"
 nick_kns_spear_08_desc:0 "A color on the shaft, a man on the point. Heralds had to draw both. They labeled the page [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_09:0 "Night-Pike"
 nick_kns_spear_09_desc:0 "Horses screamed first. Then everything else. Pickets were doubled and still said it would not help against [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_10:0 "Wolf-Reed"
 nick_kns_spear_10_desc:0 "Light, running, tireless. Shepherds moved flocks when that pennon showed. They moved them from [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_11:0 "Oath-Point"
 nick_kns_spear_11_desc:0 "Two lords, one spear, one liar. Holmgangs went out of fashion in that country. The fashion-change was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_12:0 "Red Ash"
 nick_kns_spear_12_desc:0 "The stain crept down the shaft a finger a year. By the fifth, no one needed it explained. They had [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_13:0 "Sea-Reed"
 nick_kns_spear_13_desc:0 "Salt-white ferrule, red other end. A boarding, a prize, a name shouted over water: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_14:0 "Grave-Reed"
 nick_kns_spear_14_desc:0 "Pulled from a mound, put into a war. The mound is famous now, but less famous than [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_15:0 "Kingfisher"
 nick_kns_spear_15_desc:0 "A dart, a splash, a sudden color. River-wardens use [ROOT.GetCharacter.GetNicknameNoTooltip] the way they use the bird: as a sign of blood in the stream."
 nick_kns_spear_16:0 "the Unbroken"
 nick_kns_spear_16_desc:0 "Three lords, one shaft. The ash outlived its owners until it found [ROOT.GetCharacter.GetFirstNameNoTooltip]. Now the pair is called [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_17:0 "Winter-Thorn"
 nick_kns_spear_17_desc:0 "Ice on the head, fog on the field. A hedge of spears, and one that mattered. Winter campaigns cite [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_18:0 "Crow-Spit"
 nick_kns_spear_18_desc:0 "Birds followed the point as if it sowed. Seed-time became a joke and a salute: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_19:0 "Law-Point"
 nick_kns_spear_19_desc:0 "A judicial combat that ended a docket. Justiciars still allow the citation [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_20:0 "Dawn-Reed"
 nick_kns_spear_20_desc:0 "First over the palisade, first into the song. Sentries hate the color of morning because of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_21:0 "the Guest"
 nick_kns_spear_21_desc:0 "Arrives before the rider. Hosts who did not invite a spear still set a place, in stories, for [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_22:0 "Saint Maurice"
 nick_kns_spear_22_desc:0 "A legionary saint's name, looted by a living reputation. The order complained. The army did not. It had [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_23:0 "the Third Point"
 nick_kns_spear_23_desc:0 "Two misses are for other men. Camp bets standardized. The book was titled [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_24:0 "Ridge-Reed"
 nick_kns_spear_24_desc:0 "Uphill, into the sun, out of the sun as owner. The cairn is ash-wood in memory. The memory is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_25:0 "the Black Toll"
 nick_kns_spear_25_desc:0 "A chain, a spear, a road reopened. Toll-takers found a new trade or a new grave. The proverb is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_26:0 "Hearth-Reed"
 nick_kns_spear_26_desc:0 "A kitchen door, a conspiracy, a point that ended both. Servants set an extra place and call it [ROOT.GetCharacter.GetNicknameNoTooltip]'s."
 nick_kns_spear_27:0 "the Unasked Spear"
 nick_kns_spear_27_desc:0 "Wars received [ROOT.GetCharacter.GetFirstNameNoTooltip] the way a body receives a point: suddenly, completely. Mustering rolls added a line for [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_28:0 "Penny-Point"
 nick_kns_spear_28_desc:0 "Cheap ash, dear tyrant. Markets reopened and priced the peace as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_29:0 "the Closed Hedge"
 nick_kns_spear_29_desc:0 "A spear-hedge that opened the other hedge. Drill-books now have a page dog-eared at [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_30:0 "Soot-Ash"
 nick_kns_spear_30_desc:0 "A burnt palisade, a clean breach. Charcoal on the shaft was left as a signature. The signature was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_31:0 "the Pale Shaft"
 nick_kns_spear_31_desc:0 "Whitewashed ash, dark work. Processions mistook it for a processional. Funerals did not. Both said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_32:0 "Mire-Reed"
 nick_kns_spear_32_desc:0 "Planted where horses foundered. The mire became a road for one person. That person is filed as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_33:0 "the Empty Socket"
 nick_kns_spear_33_desc:0 "A head taken, a shaft kept. Heralds hate the image and cannot stop drawing [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_34:0 "Crow's Reed"
 nick_kns_spear_34_desc:0 "Birds sat the length of it when the field cooled. Bird-counters on walls called the count [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_35:0 "the Red Ford"
 nick_kns_spear_35_desc:0 "A river named for a morning. Children skip stones and chant [ROOT.GetCharacter.GetNicknameNoTooltip] without knowing the depth."
 nick_kns_spear_36:0 "Frost-Point"
 nick_kns_spear_36_desc:0 "It stuck to gloves and to stories. Winter watches are still told not to grab strange ash. They are told about [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_37:0 "the Tithe Spear"
 nick_kns_spear_37_desc:0 "Granary doors, a lock, a point. Bread returned. The peel in that bakery has a notch called [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_38:0 "Horn-Reed"
 nick_kns_spear_38_desc:0 "A blast stopped mid-breath. The breath that replaced it in the line was the name [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_39:0 "the Last Pike"
 nick_kns_spear_39_desc:0 "When the hedge thinned, [ROOT.GetCharacter.GetFirstNameNoTooltip] was the hedge. Manuals call that formation by a forbidden nickname: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_40:0 "Sable Ash"
 nick_kns_spear_40_desc:0 "Dark bindings, five dark years. [ROOT.GetCharacter.GetFirstNameNoTooltip] would not stain it brighter. Fame did, and the stain was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_41:0 "the Cut Peace"
 nick_kns_spear_41_desc:0 "A parley, a hidden knife, a spear that had not been hidden well enough for the knife's owner. Envoys write [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_42:0 "Stone-Point"
 nick_kns_spear_42_desc:0 "Sparks on a barbican, then a man on the walk. Watch-horns now have a call unofficially named [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_43:0 "the Unpaid Reed"
 nick_kns_spear_43_desc:0 "No bounty for a necessary hole in a man. Courts dislike precedents they did not sell. The precedent is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_44:0 "Yew-Point"
 nick_kns_spear_44_desc:0 "It outranged courtesy and undercut archery pride. Butts in that shire are dedicated, jokingly, to [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_45:0 "the Narrow Reed"
 nick_kns_spear_45_desc:0 "A stair-fight, no room to sweep, only to poke. Castles redesign stairs and still talk of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_46:0 "Gallows-Point"
 nick_kns_spear_46_desc:0 "A hanging paused, then cancelled in a new way. The oak is a relic. The relic-name is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_47:0 "the Pale Palisade"
 nick_kns_spear_47_desc:0 "Fog, stakes, a banner on a spear that was not supposed to be there. Marsh law begins with [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_48:0 "Amen-Reed"
 nick_kns_spear_48_desc:0 "A benediction, a breach, a stillness. Deacons flinch and remember [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_49:0 "the Low Hedge"
 nick_kns_spear_49_desc:0 "A fight in a crypt of spears held short. The dead received guests. The guest-list is headed [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_50:0 "Salt-Point"
 nick_kns_spear_50_desc:0 "A boom-chain, a custom-house, a harbor that ran honest. Nets dried that week are still called [ROOT.GetCharacter.GetNicknameNoTooltip]'s catch."
 nick_kns_spear_51:0 "the Third Stake"
 nick_kns_spear_51_desc:0 "Two storms of men failed. [ROOT.GetCharacter.GetFirstNameNoTooltip] walked the third like a road. Sappers spit and say [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_52:0 "Briar-Reed"
 nick_kns_spear_52_desc:0 "Thorns, a pursuit, a point that widened the world. Pursuers will not take that path. They call it [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_53:0 "the Cold Lance"
 nick_kns_spear_53_desc:0 "No banners, only breath-steam and one pennon. A relic-fair closed early. The hour is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_54:0 "Whet-Point"
 nick_kns_spear_54_desc:0 "Stone on iron before every mass. Camps listen for it. When they hear it they say the mass of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_55:0 "the Closed Causeway"
 nick_kns_spear_55_desc:0 "An ambush became a story about the ambushers. The stones are still stained. The stain's name is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_56:0 "River-Reed"
 nick_kns_spear_56_desc:0 "A weir of living men undone. Eelers date their best year from [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_57:0 "the Bone Hedge"
 nick_kns_spear_57_desc:0 "A breach stacked, then cleared, then taught. Captains point with a stick and say this is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_58:0 "Pyre-Reed"
 nick_kns_spear_58_desc:0 "Ash for the dead, ash in the hand. Smoke wrote a letter home. The seal was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_59:0 "the Unsmiling Point"
 nick_kns_spear_59_desc:0 "A feast's challenge, a courtyard, no encore. House-rules now forbid dice near stories of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_60:0 "Cinder-Ash"
 nick_kns_spear_60_desc:0 "A shaft pulled from a burnt hold and put through a new one. Charters restart at the year of [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_61:0 "the Debt Point"
 nick_kns_spear_61_desc:0 "Borrowed spear, repaid dynasty. That house's tree is shorter and labeled [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_62:0 "Wolf-Point"
 nick_kns_spear_62_desc:0 "It worried the edges of hosts. Outriders came in fewer. Their widows say [ROOT.GetCharacter.GetNicknameNoTooltip] like a weather-word."
 nick_kns_spear_63:0 "the Open Pale"
 nick_kns_spear_63_desc:0 "Stakes meant to keep men out learned to let one in. Carpenters still hate the job they call [ROOT.GetCharacter.GetNicknameNoTooltip]'s gate."
 nick_kns_spear_64:0 "Saint-Breaker"
 nick_kns_spear_64_desc:0 "A false relic-spear, a true riot, an ending. Calendars lost a feast and gained [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_65:0 "the Red Hedge"
 nick_kns_spear_65_desc:0 "A shield-wall the color of its day. Boys play at it with sticks and get cuffed for saying [ROOT.GetCharacter.GetNicknameNoTooltip] too loud."
 nick_kns_spear_66:0 "Hound-Reed"
 nick_kns_spear_66_desc:0 "It coursed men from a holdfast. Horns were late. The proper call, huntsmen admit, is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_67:0 "the Quiet Palisade"
 nick_kns_spear_67_desc:0 "No cry, a taken wall, a town blinking. Watch-ordinances list a condition: unless [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_68:0 "Winter-Reed"
 nick_kns_spear_68_desc:0 "Ice in the lugs, a hedge that did not break. Frozen wars keep a mascot and its name is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_69:0 "the Tithe Point"
 nick_kns_spear_69_desc:0 "Locks, barns, a returned loaf. Peel-boards have a burn-mark the bakers salute as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_70:0 "the Empty Saddle"
 nick_kns_spear_70_desc:0 "A spearman on foot did a horseman's work. The horse came home wiser. Stables hang a ribbon for [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_71:0 "Soot-Point"
 nick_kns_spear_71_desc:0 "Roof-work, black ferrule, a keep under new air. They would not clean it. Cleaning would insult [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_72:0 "the Last Pennon"
 nick_kns_spear_72_desc:0 "Colors fell until one hung from [ROOT.GetCharacter.GetHerHis] ash. Heralds ran out of fathers to name and wrote [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_73:0 "Iron Matins"
 nick_kns_spear_73_desc:0 "First office, first death, a day that never recovered. Night-offices in that fief still nod to [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_74:0 "the Unasked Reed"
 nick_kns_spear_74_desc:0 "Help like a puncture: precise, uninvited. Councils keep a contingency named [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_75:0 "Penny-Reed"
 nick_kns_spear_75_desc:0 "A peasant shaft and a prince's end. Peddlers sell toy spears and get fined in [ROOT.GetCharacter.GetFirstNameNoTooltip]'s shadow, which is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_76:0 "the Closed Rank"
 nick_kns_spear_76_desc:0 "Dressing by the right does not stop a point. Dressing broke. Sergeants still shout [ROOT.GetCharacter.GetNicknameNoTooltip] when the line bows."
 nick_kns_spear_77:0 "Ridge-Point"
 nick_kns_spear_77_desc:0 "Downhill was for other men. [ROOT.GetCharacter.GetFirstNameNoTooltip] went up. The cairn is not a saint's. It is [ROOT.GetCharacter.GetNicknameNoTooltip]'s."
 nick_kns_spear_78:0 "the Black Stake"
 nick_kns_spear_78_desc:0 "A charred pale kept as a relic of a judgment. Pilgrims guess wrong. Locals shrug and say [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_79:0 "Frost-Reed"
 nick_kns_spear_79_desc:0 "A carol of ice and shouting, badly sung. The refrain, unfortunately, is [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_80:0 "the Cut Tithe"
 nick_kns_spear_80_desc:0 "Half to the hungry, half denied a hoarder. Bread-weights click a little extra for [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_81:0 "Stone-Reed"
 nick_kns_spear_81_desc:0 "It found the joint in a wall the way a thorn finds skin. Masons drink when a contract smells like [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_82:0 "the Unpaid Point"
 nick_kns_spear_82_desc:0 "No purse. Bribes failed as an industry. The industry that replaced them was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_83:0 "Yew-Reed"
 nick_kns_spear_83_desc:0 "Bow-staves and bowmen, then hay in the yard. Old men call that hay [ROOT.GetCharacter.GetNicknameNoTooltip]'s crop."
 nick_kns_spear_84:0 "the Third Mass"
 nick_kns_spear_84_desc:0 "Two warnings from a priest, then [ROOT.GetCharacter.GetFirstNameNoTooltip]. Registers skip to burials under [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_85:0 "Amen-Point"
 nick_kns_spear_85_desc:0 "The word, the wound, the quiet. Choirboys are forbidden it and therefore say [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_86:0 "the Low Palisade"
 nick_kns_spear_86_desc:0 "A ditch-fight, spears like a roof. The roof leaked one man. The leak is famous as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_87:0 "Salt-Reed"
 nick_kns_spear_87_desc:0 "A fair wind after an unfair tax. Fishwives still pin the weather on [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_88:0 "the Last Ash"
 nick_kns_spear_88_desc:0 "When groves and companies were spent, one shaft remained, and [ROOT.GetCharacter.GetFirstNameNoTooltip] with it. Pretenders cite [ROOT.GetCharacter.GetNicknameNoTooltip] and sit down."
 nick_kns_spear_89:0 "Gae Bulg"
 nick_kns_spear_89_desc:0 "A scholar said the old Irish name as a joke. The joke stopped being funny. The name [ROOT.GetCharacter.GetNicknameNoTooltip] did not stop."
 nick_kns_spear_90:0 "the Luin"
 nick_kns_spear_90_desc:0 "It needed blood or it would burn the hand. Five years of hands remained unburnt. Poets used [ROOT.GetCharacter.GetNicknameNoTooltip] anyway."
 nick_kns_spear_91:0 "Ascalon"
 nick_kns_spear_91_desc:0 "Dragon-stories attached themselves like burrs. [ROOT.GetCharacter.GetFirstNameNoTooltip] never saw a dragon. {He} saw men. They still said [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_92:0 "Gungnir"
 nick_kns_spear_92_desc:0 "A drunk skald would not recant. Courts of fame, exhausted, enrolled [ROOT.GetCharacter.GetFirstNameNoTooltip] under [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_93:0 "the Pelian Ash"
 nick_kns_spear_93_desc:0 "Clerks dragged Achilles into a Christian century. The century kept the clerk's mistake: [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_94:0 "Hector's Dory"
 nick_kns_spear_94_desc:0 "Schoolroom Troy, real mud. A tutor wept at the comparison and then published it. The publication was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_95:0 "the Swan-Reed"
 nick_kns_spear_95_desc:0 "A pale pennon, a grim crossing. Romances tried to pretty it. The field kept [ROOT.GetCharacter.GetNicknameNoTooltip] ugly and true."
 nick_kns_spear_96:0 "Amenonuhoko"
 nick_kns_spear_96_desc:0 "A traveler's island-name, stolen for a western war. Stolen names stick if the point does. It did. [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_97:0 "the Theban Shaft"
 nick_kns_spear_97_desc:0 "Maurice's legion in a chaplain's mouth. The mouth was ignored. The name [ROOT.GetCharacter.GetNicknameNoTooltip] was not."
 nick_kns_spear_98:0 "Boar's Bane"
 nick_kns_spear_98_desc:0 "The same motion in a thicket and in a breach. Tusk and visor. Hunts and wars agreed on [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_99:0 "the Reed of Destiny"
 nick_kns_spear_99_desc:0 "Men who had read too many crusade-letters used a grand phrase. Grand phrases die. This one lived as [ROOT.GetCharacter.GetNicknameNoTooltip]."
 nick_kns_spear_100:0 "Odin's Guest"
 nick_kns_spear_100_desc:0 "A votive spear came down from a hall-beam. Hospitality, northern-style. The guest-name was [ROOT.GetCharacter.GetNicknameNoTooltip]."
 kns_nickname_story_fallback:0 "After five years the singers found a name that would stick, and they hung it on [ROOT.GetCharacter.GetFirstNameNoTooltip] like a banner."
