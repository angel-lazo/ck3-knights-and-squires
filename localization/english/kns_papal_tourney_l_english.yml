l_english:
 activity_kns_papal_youth_tourney:0 "Papal Youth Tourney"
 activity_kns_papal_youth_tourney_name:0 "The Youth Tourney in Rome"
 activity_kns_papal_youth_tourney_desc:0 "The Holy Father has called the young of Christendom to Rome. Unlanded Christian men and women of sixteen to twenty-five years may take the field if they are free of sinful traits, illness, and physical deformity. Landless adventurers and their camps may not enter. Giants may still ride. The champion will be dubbed a [kns_knight|E] by the Pope himself, and named Prodigious."
 activity_kns_papal_youth_tourney_selection_tooltip:0 "A youth tourney hosted by the Pope. The winner is dubbed and given papal arms."
 activity_kns_papal_youth_tourney_host_desc:0 "$BULLET_WITH_TAB$The Pope will dub the champion"
 activity_kns_papal_youth_tourney_guest_desc:0 "You may compete if you are Christian, unlanded, not a landless adventurer, 16 to 25, without sinful traits, illness, or physical deformity. Giants may enter."
 activity_kns_papal_youth_tourney_guest_help_text:0 "$activity_kns_papal_youth_tourney_desc$"
 activity_kns_papal_youth_tourney_owner:0 "Host"
 activity_kns_papal_youth_tourney_province_desc:0 "The lists are raised at the papal capital."
 activity_kns_papal_youth_tourney_destination_selection:0 "The tourney is held in the Pope's capital."
 activity_kns_papal_youth_tourney_conclusion_desc:0 "The lists in Rome are closed. A champion has been named."

 kns_papal_tourney.0002.opening:0 "To [recipient.GetShortUIName],"
 kns_papal_tourney.0002.desc:0 "The Holy Father, [kns_pope.GetShortUIName], has called a youth tourney in Rome. Men and women of sixteen to twenty-five years, if they keep the Christian custom of knighthood, may take the field. The Pope will name no sinner, nor any who is ill or of broken body, nor any landless adventurer. Giants may still ride. The champion will be dubbed a knight by the Pope and armed from his own hand.\n\nThe lists will not wait long."
 kns_papal_tourney.0002.a:0 "I will ride to Rome"
 kns_papal_tourney.0002.b:0 "I must decline"
 kns_papal_tourney.0002.c:0 "I will remember this"
 kns_papal_tourney_accept_tt:0 "You will compete in the papal youth tourney"
 kns_papal_tourney_decline_tt:0 "You stay home. The tourney still takes place."
 kns_papal_tourney_watch_tt:0 "You are not eligible to compete, but you have heard the summons"
 kns_papal_tourney_christian_tt:0 "Follows a Christian faith"
 kns_papal_tourney_unlanded_tt:0 "Is not a landed ruler"
 kns_papal_tourney_no_adventurer_tt:0 "Is not a landless adventurer, and does not serve in an adventurer camp"
 kns_papal_tourney_no_sins_tt:0 "Has no sinful traits"
 kns_papal_tourney_no_illness_tt:0 "Is not ill"
 kns_papal_tourney_no_deformity_tt:0 "Has no physical deformity. Giants may enter."

 kns_papal_tourney.0011.t:0 "The Accolade at Rome"
 kns_papal_tourney.0011.desc_won:0 "The dust of the Roman lists is on your teeth. [kns_pope.GetTitledFirstName] bids you kneel. The blade touches your shoulder, and the singers already have a word for what you are: Prodigious. Arms from the Holy Father's own store are laid in your hands."
 kns_papal_tourney.0011.desc_lost:0 "You rode to Rome and took your turn in the press. Another stood when the last horn sounded.\n\nThe champion is [kns_papal_winner.GetTitledFirstName]. The Pope has dubbed [kns_papal_winner.GetHerHim] and named [kns_papal_winner.GetHerHim] Prodigious."
 kns_papal_tourney.0011.desc_news:0 "Word from Rome: [kns_pope.GetTitledFirstName] has held a youth tourney.\n\nThe champion is [kns_papal_winner.GetTitledFirstName], dubbed a knight by the Pope and named Prodigious."
 kns_papal_tourney.0011.desc_none:0 "The lists in Rome were called, but no champion could be named."
 kns_papal_tourney.0011.a:0 "I rise a knight"
 kns_papal_tourney.0011.b:0 "So the age has its marvel"
 kns_papal_tourney.0011.c:0 "A pity"
 kns_papal_tourney_winner_toast:0 "Champion of Rome"
 kns_papal_tourney_winner_toast.tt:0 "The champion is [kns_papal_winner.GetTitledFirstName]. The Pope has dubbed [kns_papal_winner.GetHerHim] Prodigious."
 kns_papal_tourney_winner_name_tt:0 "The champion is [kns_papal_winner.GetTitledFirstName]"

 kns_art_papal_tourney_weapon_desc:0 "Given by the Pope as the prize of the youth tourney in Rome. The Holy Father's hand is in its history, and there is no sharper prowess in a mortal weapon."
 kns_art_papal_tourney_armor_desc:0 "Given by the Pope as the prize of the youth tourney in Rome. The Holy Father's hand is in its history, and the harness is illustrious."

 kns_papal_melee_phase:0 "The Lists"
 kns_papal_melee_phase_desc:0 "The youth of Christendom meet in the papal lists."
