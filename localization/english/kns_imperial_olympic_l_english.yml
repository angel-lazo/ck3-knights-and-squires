l_english:
 kns_imperial_olympic_not_on_cooldown_tt:0 "The Imperial Olympic Games are not on cooldown"

 kns_imperial_olympic.0001.t:0 "The Size of the Bracket"
 kns_imperial_olympic.0001.desc:0 "How large a bracket do you wish to call? Invited Christian rulers send champions by rank: one for a count, two for a duke, three for a king, four for an emperor or hegemon.\n\nEvery Prodigious knight who is fit to fight is entered. The thirty strongest Christian knights aged thirty-five and under are entered as well. Invited rulers then fill what remains. If fewer than the bracket size answer the summons, the lists still run with byes."

 kns_imperial_olympic.0001.a:0 "A bracket of one hundred and twenty-eight"
 kns_imperial_olympic.0001.b:0 "A bracket of two hundred and fifty-six"

 kns_imperial_olympic_field_128_tt:0 "Bracket size: 128 entrants"
 kns_imperial_olympic_field_256_tt:0 "Bracket size: 256 entrants"

 kns_imperial_olympic.0002.t:0 "The Cycle of the Games"
 kns_imperial_olympic.0002.desc:0 "Like the contests of old, these games will return of their own accord. Choose how many years will pass between each raising of the lists. You may change this later."
 kns_imperial_olympic.0002.a:0 "Every two years"
 kns_imperial_olympic.0002.b:0 "Every three years"
 kns_imperial_olympic.0002.c:0 "Every four years"
 kns_imperial_olympic_interval_2_tt:0 "The games return every 2 years"
 kns_imperial_olympic_interval_3_tt:0 "The games return every 3 years"
 kns_imperial_olympic_interval_4_tt:0 "The games return every 4 years"

 kns_imperial_olympic.0006.t:0 "The Champion's Purse"
 kns_imperial_olympic.0006.desc:0 "You fund the games from your treasury: at least one thousand gold, at most five thousand. The victor takes #V 40%#! of that gold. The rest pays for the festival itself.\n\nA richer purse trains your knights harder and, for six months, raises taxes in the county that hosted the lists. At five thousand gold the host county gains #V +50%#! tax."
 kns_imperial_olympic.0006.a:0 "One thousand gold"
 kns_imperial_olympic.0006.b:0 "Two thousand gold"
 kns_imperial_olympic.0006.c:0 "Three thousand gold"
 kns_imperial_olympic.0006.d:0 "Four thousand gold"
 kns_imperial_olympic.0006.e:0 "Five thousand gold"
 kns_imperial_olympic_prize_gold_1000_tt:0 "You pay 1000 gold. Victor: 400 gold, 50 [renown|E]. Host county tax: +10% for 6 months. Knight effectiveness: +20%"
 kns_imperial_olympic_prize_gold_2000_tt:0 "You pay 2000 gold. Victor: 800 gold, 100 [renown|E]. Host county tax: +20% for 6 months. Knight effectiveness: +40%"
 kns_imperial_olympic_prize_gold_3000_tt:0 "You pay 3000 gold. Victor: 1200 gold, 150 [renown|E]. Host county tax: +30% for 6 months. Knight effectiveness: +60%"
 kns_imperial_olympic_prize_gold_4000_tt:0 "You pay 4000 gold. Victor: 1600 gold, 200 [renown|E]. Host county tax: +40% for 6 months. Knight effectiveness: +80%"
 kns_imperial_olympic_prize_gold_5000_tt:0 "You pay 5000 gold. Victor: 2000 gold, 250 [renown|E]. Host county tax: +50% for 6 months. Knight effectiveness: +100%"

 kns_imperial_olympic.0003.t:0 "Where the Lists Stand"
 kns_imperial_olympic.0003.desc:0 "The games may be raised in your capital, or in any county of your realm. If no place is chosen when the lists open, they default to your capital."
 kns_imperial_olympic.0003.a:0 "The capital"
 kns_imperial_olympic.0003.b:0 "Choose a county"
 kns_imperial_olympic.0003.cancel:0 "Abandon the plan"
 kns_imperial_olympic_venue_capital_tt:0 "Host at your capital county"
 kns_imperial_olympic_venue_pick_tt:0 "Open a title picker and choose any realm county"
 kns_imperial_olympic_cancel_tt:0 "Cancel the Imperial Olympic Games"

 kns_imperial_olympic.0004.t:0 "Proclaim the Games"
 kns_imperial_olympic.0004.desc:0 "Summons will go out to Christian rulers within diplomatic range. They may ride to the lists themselves and send champions from their courts: one for a count, two for a duke, three for a king, four for an emperor or hegemon. Your selected champions will be entered first. Every Prodigious knight fit to fight is entered, then the thirty strongest Christian knights aged thirty-five and under.\n\nWhen the lists close, the victor takes five thousand prestige, forty percent of the gold you funded, dynasty [renown|E] scaled to the purse (up to 250 at five thousand gold), and knighthood if they are not yet a knight (unless they are you). The host county's taxes swell for six months. The games will then return on the cycle you chose."

 kns_imperial_olympic.0004.a:0 "Let the games begin"
 kns_imperial_olympic.0004.b:0 "Not yet"

 kns_imperial_olympic_start_tt:0 "Invitations go out and the bracket begins if at least two entrants can be gathered"

 kns_imperial_olympic.0005.t:0 "Empty Lists"
 kns_imperial_olympic.0005.desc:0 "The summons went forth, but fewer than two worthy entrants could be gathered. The games cannot be held."

 kns_imperial_olympic.0005.a:0 "A wasted proclamation"

 kns_imperial_olympic.0007.t:0 "The Games Return"
 kns_imperial_olympic.0007.desc:0 "The cycle has come round. Heralds ride once more, and the Imperial Olympic Games are raised on the lists you set."
 kns_imperial_olympic.0007.a:0 "Let them fight"

 kns_imperial_olympic.0020.t:0 "Manage the Imperial Games"
 kns_imperial_olympic.0020.desc:0 "The games are an institution of your empire. Change how often they return, the champion's purse, the size of the bracket, or where the lists stand. The next cycle will use whatever you set."
 kns_imperial_olympic.0020.a:0 "Change the cycle"
 kns_imperial_olympic.0020.a.tt:0 "Choose every 2, 3, or 4 years"
 kns_imperial_olympic.0020.b:0 "Change the purse"
 kns_imperial_olympic.0020.b.tt:0 "Set the fund from 1000 to 5000 gold. The victor takes 40%; the rest pays for the games."
 kns_imperial_olympic.0020.c:0 "Change the bracket"
 kns_imperial_olympic.0020.c.tt:0 "128 or 256 entrants"
 kns_imperial_olympic.0020.d:0 "Change the venue"
 kns_imperial_olympic.0020.d.tt:0 "Capital, or any county in your realm"
 kns_imperial_olympic.0020.e:0 "Raise the lists now"
 kns_imperial_olympic.0020.close:0 "Leave it as it stands"

 kns_imperial_olympic.0030.t:0 "The Games of Your Predecessor"
 kns_imperial_olympic.0030.desc:0 "The Imperial Olympic Games were already paid for and raised as an imperial custom. If you keep them, they will return on a cycle of your choosing, and you will set the champion's purse. There is no further cost.\n\nIf you let the custom die, the lists will not raise themselves again."
 kns_imperial_olympic.0030.a:0 "The tradition will stand"
 kns_imperial_olympic.0030.a.tt:0 "No gold or prestige cost. Choose the cycle, then the purse. Bracket size and venue are kept from the last games."
 kns_imperial_olympic.0030.b:0 "Let the custom die"
 kns_imperial_olympic.0030.b.tt:0 "The games will not return on their own. You may found them again later at full cost."

 kns_imperial_olympic.0031.t:0 "The Lists Are Yours"
 kns_imperial_olympic.0031.desc:0 "Your predecessor died while the Imperial Olympic Games were still being fought. The remaining bouts are now yours to see through. When this bracket is done, the custom will not continue unless you take it up as emperor."
 kns_imperial_olympic.0031.a:0 "Finish what was begun"
 kns_imperial_olympic.0031.a.tt:0 "This bracket continues. After it, use Continue the Imperial Olympic Games if you remain emperor."

 kns_imperial_olympic.0032.t:0 "The Custom Is Yours"
 kns_imperial_olympic.0032.desc:0 "The Imperial Olympic Games will return on the cycle you set, with the purse you named. No further payment was due: the founding was already bought."
 kns_imperial_olympic.0032.a:0 "So it shall be"

 kns_imperial_olympic.0102.t:0 "The Finals"
 kns_imperial_olympic.0102.desc:0 "The last pairing of the Imperial Olympic Games is named. [kns_olympic_fighter_a.GetTitledFirstName] stands against [kns_olympic_fighter_b.GetTitledFirstName]. This bout is fought in the lists, to first blood, not to the death.\n\nYour prowess: [ROOT.Char.MakeScope.Var('kns_olympic_display_my_prowess').GetValue|0]. [kns_olympic_fake_opponent.GetTitledFirstNamePossessive] prowess: [ROOT.Char.MakeScope.Var('kns_olympic_display_foe_prowess').GetValue|0]."
 kns_imperial_olympic.0102.a:0 "Begin the bout"
 kns_imperial_olympic.0102.a.tt:0 "The Finals begin. First blood, not to the death."

 kns_imperial_olympic.0010.t:0 "Crown the Victor"
 kns_imperial_olympic.0010.desc_self:0 "The last bout is done and the lists fall silent. The heralds name you victor of the Imperial Olympic Games. Five thousand prestige is yours by right of the bracket, forty percent of the gold you funded for the lists, and [renown|E] for your house in proportion to that purse."
 kns_imperial_olympic.0010.desc_crown:0 "The bracket is decided. Before the gathered rulers of Christendom you raise [kns_olympic_winner.GetTitledFirstNamePossessive] hand and name [kns_olympic_winner.GetHerHim] victor of the Imperial Olympic Games. Five thousand prestige, forty percent of the funded gold, [renown|E] for their house scaled to the purse, and knighthood if they have not yet been dubbed, go to the champion."
 kns_imperial_olympic.0010.desc_none:0 "The games were proclaimed, but no victor could be crowned."
 kns_imperial_olympic.0010.a:0 "The crown is mine"
 kns_imperial_olympic.0010.b:0 "Let the heralds proclaim it"
 kns_imperial_olympic.0010.c:0 "A hollow proclamation"
 kns_imperial_olympic_prize_tt:0 "The champion receives #V 5000#! [prestige|E], #V 40%#! of the gold you funded, and [renown|E] equal to #V 5%#! of the purse (50 at 1000 gold, 250 at 5000). You pay the full fund; the rest is the cost of the games. If you are champion, you still receive the 40% prize. The host county gains tax for 6 months (up to +50% at 5000 gold)"

 kns_imperial_olympic.0011.t:0 "Victor of the Imperial Games"
 kns_imperial_olympic.0011.desc_won:0 "[kns_emperor.GetTitledFirstName] has crowned you victor of the Imperial Olympic Games. Five thousand prestige is yours, forty percent of the gold funded for the lists, and [renown|E] for your house in proportion to that purse."
 kns_imperial_olympic.0011.desc_lost:0 "You competed in the imperial games, but another stood last in the bracket.\n\nThe victor is [kns_olympic_winner.GetTitledFirstName]."
 kns_imperial_olympic.0011.desc_news:0 "Word from the imperial games: [kns_emperor.GetTitledFirstName] has closed the lists.\n\nThe victor is [kns_olympic_winner.GetTitledFirstName]."
 kns_imperial_olympic.0011.desc_none:0 "The imperial games were proclaimed, but no victor could be named."

 kns_imperial_olympic.0011.a:0 "I am victor"
 kns_imperial_olympic.0011.b:0 "So the lists decide"
 kns_imperial_olympic.0011.c:0 "A pity"

 kns_imperial_olympic.0012.t:0 "A Champion of the Games"
 kns_imperial_olympic.0012.desc_self:0 "The Imperial Olympic Games are closed. The heralds name you champion of the lists: five thousand prestige, forty percent of the funded gold, and [renown|E] for your house in proportion to that purse."
 kns_imperial_olympic.0012.desc:0 "The Imperial Olympic Games are closed. The last bout is done, and the heralds name [kns_olympic_winner.GetTitledFirstName] champion of the lists."
 kns_imperial_olympic.0012.desc_none:0 "Word of the imperial games has come, but no champion could be named."
 kns_imperial_olympic.0012.a:0 "The crown is mine"
 kns_imperial_olympic.0012.b:0 "So the lists decide"
 kns_imperial_olympic.0012.c:0 "A hollow proclamation"

 kns_imperial_olympic.0104.t:0 "Worn Arms"
 kns_imperial_olympic.0104.desc:0 "Your smiths stop you before you take the lists. A duel can strip five to fifteen percent of a weapon or harness's strength if you lose, and five to ten if you win. What you wear now is already at fifteen percent of its soundness, or worse. Pay the smiths, or trust the iron as it stands."
 kns_imperial_olympic.0104.a:0 "Pay the smiths"
 kns_imperial_olympic.0104.a.tt:0 "Restore worn weapon and armor to full durability. Costs 50 gold per worn piece"
 kns_imperial_olympic.0104.b:0 "I will fight as I am"
 kns_imperial_olympic.0104.b.tt:0 "Begin the round without repairing"
 kns_imperial_olympic.0105.toast:0 "The bout could not be completed. The same pairing will fight again."
 kns_imperial_olympic.0106.toast:0 "The bout did not finish in the lists. The heralds name a victor by prowess."

 kns_imperial_olympic.0108.t:0 "The Lists"
 kns_imperial_olympic.0108.t_win:0 "Won the Round"
 kns_imperial_olympic.0108.t_win_round_1:0 "Won the 1st Round"
 kns_imperial_olympic.0108.t_win_round_2:0 "Won the 2nd Round"
 kns_imperial_olympic.0108.t_win_round_3:0 "Won the 3rd Round"
 kns_imperial_olympic.0108.t_win_round_4:0 "Won the 4th Round"
 kns_imperial_olympic.0108.t_win_round_5:0 "Won the 5th Round"
 kns_imperial_olympic.0108.t_win_quarter:0 "Won the Quarter Finals"
 kns_imperial_olympic.0108.t_win_semi:0 "Won the Semi Finals"
 kns_imperial_olympic.0108.t_lose:0 "Lost the Round"
 kns_imperial_olympic.0108.t_lose_round_1:0 "Lost the 1st Round"
 kns_imperial_olympic.0108.t_lose_round_2:0 "Lost the 2nd Round"
 kns_imperial_olympic.0108.t_lose_round_3:0 "Lost the 3rd Round"
 kns_imperial_olympic.0108.t_lose_round_4:0 "Lost the 4th Round"
 kns_imperial_olympic.0108.t_lose_round_5:0 "Lost the 5th Round"
 kns_imperial_olympic.0108.t_lose_quarter:0 "Lost the Quarter Finals"
 kns_imperial_olympic.0108.t_lose_semi:0 "Lost the Semi Finals"
 kns_imperial_olympic.0108.desc_win:0 "Today's fighting is done. You have overcome [kns_olympic_fake_opponent.GetTitledFirstName] and advance to the next round of the Imperial Olympic Games.\n\nYour prowess: [ROOT.Char.MakeScope.Var('kns_olympic_display_my_prowess').GetValue|0]. [kns_olympic_fake_opponent.GetTitledFirstNamePossessive] prowess: [ROOT.Char.MakeScope.Var('kns_olympic_display_foe_prowess').GetValue|0]. The lists gave you a [ROOT.Char.MakeScope.Var('kns_olympic_fake_win_percent').GetValue|0]% chance to win."
 kns_imperial_olympic.0108.desc_lose:0 "Today's fighting is done. You have fallen to [kns_olympic_fake_opponent.GetTitledFirstName]. Your run in the lists is over.\n\nYour prowess: [ROOT.Char.MakeScope.Var('kns_olympic_display_my_prowess').GetValue|0]. [kns_olympic_fake_opponent.GetTitledFirstNamePossessive] prowess: [ROOT.Char.MakeScope.Var('kns_olympic_display_foe_prowess').GetValue|0]. The lists gave you a [ROOT.Char.MakeScope.Var('kns_olympic_fake_win_percent').GetValue|0]% chance to win."
 kns_imperial_olympic.0108.a:0 "I advance"
 kns_imperial_olympic.0108.a.tt:0 "You move on with the other victors of the day. The next round is fought tomorrow."
 kns_imperial_olympic.0108.b:0 "So the lists decide"
 kns_imperial_olympic.0108.b.tt:0 "You are out. The remaining rounds continue without you, one per day."

 kns_imperial_olympic_winner_toast:0 "Victor of the Imperial Games"
 kns_imperial_olympic_winner_toast.tt:0 "The victor is [kns_olympic_winner.GetTitledFirstName]."
 kns_imperial_olympic_winner_name_tt:0 "The victor is [kns_olympic_winner.GetTitledFirstName]"

 kns_art_olympic_sword_name:0 "Sword of the Imperial Games"
 kns_art_olympic_sword_desc:0 "Awarded as the grand prize of the Imperial Olympic Games. The Emperor's hand is in its history."
 kns_art_olympic_axe_name:0 "Axe of the Imperial Games"
 kns_art_olympic_axe_desc:0 "Awarded as the grand prize of the Imperial Olympic Games. The Emperor's hand is in its history."

 kns_olympic_champion_opinion:0 "Imperial Games Victor"
 kns_olympic_knight_culture_modifier:0 "[knight_effectiveness|E]"
 kns_olympic_knight_culture_modifier_desc:0 ""
 kns_olympic_host_county_modifier:0 "Host of the Imperial Games"
 kns_olympic_host_county_modifier_desc:0 "The festival spent in this county fills the markets. Taxes are raised for six months, up to half again at a full purse."
 kns_olympic_choose_venue_interaction:0 "Choose the Olympic Venue"
 kns_olympic_choose_venue_interaction_desc:0 "Select a county in your realm to raise the lists. If you pick none, the capital is used."
