l_english:
 # Game concepts
 game_concept_squire:0 "Squire"
 game_concept_squire_desc:0 "A youth bound to a [kns_knight|E] to learn arms, courtesy, and the duties of knighthood. Progress is tracked on the Squire trait. At high progress, any knight - or a Christian king - may dub them."
 game_concept_squires:0 "Squires"
 game_concept_squirepossessive:0 "Squire's"
 game_concept_kns_knight:0 "Knight"
 game_concept_kns_knight_desc:0 "A Christian man or woman who has been dubbed and may take [squires|E], grant knighthood to the worthy, and stand in the first rank of battle. In this mod, knighthood is a rank of honor among Christians, not merely a place in the army."
 game_concept_kns_knights:0 "Knights"
 game_concept_kns_knightspossessive:0 "Knight's"

 # Traits
 trait_squire:0 "Squire"
 trait_squire_desc:0 "This character is training toward knighthood under a knight's hand."
 trait_squire_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] serves as a squire and is learning the ways of knighthood."
 trait_squire_no_knight_desc:0 "This squire currently has no knight and must find another master or be dubbed."
 trait_knight:0 "Knight"
 trait_knight_desc:0 "This character has been dubbed a knight and may take squires of their own. Knighthood grants 1 [prestige|E] each month, +5 [attraction|E] opinion, +5 general opinion, and +5 opinion with other knights."
 trait_knight_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has been made a knight."
 trait_stripped_knight:0 "Stripped of Knighthood"
 trait_stripped_knight_desc:0 "This character was publicly stripped of knighthood and may not be dubbed again."
 trait_stripped_knight_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] was stripped of knighthood in disgrace."
 trait_track_knight:0 "Knighthood"
 trait_track_knight_desc:0 "Service, courtesy, and skill at arms. A squire who masters this path may be dubbed a knight."

 # Relations
 kns_squire:0 "Squire"
 kns_knight:0 "Knight"

 # Modifiers
 kns_has_squire_modifier:0 "Has a Squire"
 kns_has_squire_modifier_desc:0 "Keeping a squire brings a little honor and keeps a knight sharp."

 # Opinions
 kns_made_me_squire_opinion:0 "Made Me a Squire"
 kns_became_my_squire_opinion:0 "Became My Squire"
 kns_knighted_me_opinion:0 "Knighted Me"
 kns_i_made_you_a_knight_opinion:0 "I Knighted Them"
 kns_removed_me_as_squire_opinion:0 "Removed Me as Squire"
 kns_removed_my_squire_opinion:0 "Took My Squire"
 kns_stripped_my_knighthood:0 "Stripped My Knighthood"
 kns_declined_knighthood_opinion:0 "Refused Knighthood"

 # Decision
 kns_buy_knighthood_decision:0 "Purchase Knighthood"
 kns_buy_knighthood_decision_desc:0 "If no worthy knight will dub me, gold and influence may still buy the accolade. The just and the content will not stoop to this, and the truly zealous find it shameful."
 kns_buy_knighthood_decision_tooltip:0 "You will be made a [kns_knight|E]"
 kns_buy_knighthood_decision_confirm:0 "Purchase Knighthood"
 kns_faith_practices_knighthood:0 "Follows a Christian faith"

 # Interactions
 kns_offer_knighthood_interaction:0 "Offer Knighthood"
 kns_offer_knighthood_interaction_desc:0 "[recipient.GetFirstNameNicknamedNoTooltipRegnal] is not yet a knight. Any knight may make a knight, and a Christian king may do the same."
 kns_offer_of_knighthood:0 "Offer of Knighthood"
 KNS_OFFER_KNIGHTHOOD_NOTIFICATION:0 "It is said that any knight may make another a knight. You are not yet dubbed. I would set that right."
 kns_knighthood_offer_rejected_toast:0 "Knighthood Refused"
 kns_knighthood_offer_rejected_toast.tt:0 "[recipient.GetShortUIName|U] has refused your offer of knighthood."
 KNS_THEY_ARE_MY_SQUIRE:0 "They are my squire"

 kns_ask_liege_knighthood_interaction:0 "Ask for Knighthood"
 kns_ask_liege_knighthood_interaction_desc:0 "Petition [recipient.GetShortUIName] to dub you a [kns_knight|E]. You may ask your [liege|E] if [recipient.GetSheHe] is a [king|E] or [emperor|E], or the king or emperor above a lesser liege. [recipient.GetSheHe|U] must follow a Christian faith, have at least 50 opinion of you, and you must have 15 [martial|E] or a martial education."
 kns_ask_for_knighthood:0 "Ask for Knighthood"
 KNS_ASK_LIEGE_KNIGHTHOOD_NOTIFICATION:0 "My lord, I have served as I ought. I ask that you make me a knight."
 kns_ask_liege_king_or_emperor_tt:0 "Is a [king|E] or [emperor|E]"
 kns_ask_liege_christian_tt:0 "Follows a Christian faith"
 kns_ask_liege_good_opinion_tt:0 "Has at least 50 opinion of you"
 kns_ask_liege_martial_tt:0 "Has at least 15 [martial|E], or a martial education"
 kns_ask_liege_knighthood_rejected_toast:0 "Knighthood Denied"
 kns_ask_liege_knighthood_rejected_toast.tt:0 "[recipient.GetShortUIName|U] has refused to dub you."

 kns_educate_squire_interaction:0 "Educate Squire"
 kns_educate_squire_interaction_desc:0 "Appoint a [squire|E] and a [kns_knight|E] in your [court|E]"
 actor_secondary_kns_educate_squire_interaction:0 "[kns_knight|E]"
 recipient_secondary_kns_educate_squire_interaction:0 "[squire|E]"
 KNS_OFFER_EDUCATE_SQUIRE:0 "Educate Squire"

 kns_offer_squire_interaction:0 "Offer Squire"
 kns_offer_squire_interaction_desc:0 "Offer [recipient.GetShortUIName] a [squire|E], making [recipient.GetHerHim] or someone in [recipient.GetHerHis] [court|E] the [kns_knight|E]"
 actor_secondary_kns_offer_squire_interaction:0 "Squire"
 recipient_secondary_kns_offer_squire_interaction:0 "Knight"
 KNS_OFFER_SQUIRE:0 "Offer Squire"

 kns_offer_knight_tutelage_interaction:0 "Offer Knight Tutelage"
 kns_offer_knight_tutelage_interaction_desc:0 "Offer [recipient.GetShortUIName] a [kns_knight|E] to take [recipient.GetHerHim] or someone in [recipient.GetHerHis] [court|E] as a [squire|E]"
 actor_secondary_kns_offer_knight_tutelage_interaction:0 "Knight"
 recipient_secondary_kns_offer_knight_tutelage_interaction:0 "Squire"
 KNS_OFFER_KNIGHT_TUTELAGE:0 "Offer Knight Tutelage"

 kns_remove_my_squire_interaction:0 "Remove Squire"
 kns_remove_my_squire_interaction_desc:0 "End [recipient.GetFirstNameNicknamedNoTooltipRegnal]'s service as your [squire|E]."
 kns_squirehood_removal:0 "Removed from Squirehood"
 KNS_REMOVAL_OF_SQUIREHOOD_NOTIFICATION:0 "You are no longer worthy to squire for me. Find another knight if you still mean to win your spurs."

 kns_remove_childs_knight_interaction:0 "Remove Child's Knight"
 kns_remove_childs_knight_interaction_desc:0 "End the squiring arrangement for [recipient.GetName]."
 KNS_REMOVE_CHILDS_KNIGHT_INTERACTION:0 "This arrangement no longer serves. I am ending it."

 kns_train_squire_interaction:0 "Train Squire"
 kns_train_squire_interaction_desc:0 "Put [recipient.GetFirstNameNicknamedNoTooltipRegnal] through a bout of knightly training. [recipient.GetSheHe|U] will still have other lessons on [recipient.GetHerHis] own."
 kns_squire_training:0 "Train Squire"
 KNS_KNIGHT_TRAINS_SQUIRE_NOTIFICATION:0 "Squire! Tomorrow we train again. Come ready."
 kns_train_squire_actor.tt:0 "You will choose what lesson [recipient.GetName] receives."
 kns_train_squire_recipient.tt:0 "Will be trained as [actor.GetName] directs."

 kns_strip_knighthood_interaction:0 "Strip Knighthood"
 kns_strip_knighthood_interaction_desc:0 "Publicly take knighthood from [recipient.GetFirstNameNicknamedNoTooltipRegnal]."
 kns_strip_knighthood:0 "Strip Knighthood"
 KNS_STRIP_KNIGHTHOOD_NOTIFICATION:0 "You are no longer a knight. The accolade is revoked."

 KNS_EDUCATE_SELECT_YOUR_KNIGHT:0 "#I Choose a [kns_knight|E] from your [court|E]#!"
 KNS_EDUCATE_SELECT_YOUR_SQUIRE:0 "#I Choose a [squire|E] from your [court|E]#!"
 KNS_EDUCATE_SELECT_THEIR_KNIGHT:0 "#I Choose a [kns_knight|E] from their [court|E]#!"
 KNS_EDUCATE_SELECT_THEIR_SQUIRE:0 "#I Choose a [squire|E] from their [court|E]#!"

 KNS_EDUCATE_RECIPIENT_SQUIRE_PERSONALLY_REQUEST:0 "I would take your [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] [secondary_recipient.GetShortUIName] as my squire myself."
 KNS_EDUCATE_SQUIRE_PERSONALLY_REQUEST:0 "I would see to your training personally, if you will have me."
 KNS_EDUCATE_RECIPIENT_SQUIRE_REQUEST:0 "I would have your [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] [secondary_recipient.GetShortUIName] squire for [secondary_actor.GetShortUIName], a capable knight."
 KNS_EDUCATE_SQUIRE_REQUEST:0 "To set you on the road to knighthood, I would have you squire for [secondary_actor.GetShortUIName]."

 KNS_SQUIRE_SHOWN_PERSONALLY_REQUEST:0 "It would be an honor if you would take me as your squire."
 KNS_SQUIRE_SHOWN_ACTOR_REQUEST:0 "I ask that you allow me to squire for [secondary_recipient.GetShortUIName]."
 KNS_SQUIRE_SHOWN_CHILD_PERSONALLY_REQUEST:0 "It would please me if you would take [secondary_actor.GetShortUIName] as your squire."
 KNS_SQUIRE_SHOWN_CHILD_REQUEST:0 "I ask that [secondary_actor.GetShortUIName] be allowed to squire for [secondary_recipient.GetShortUIName]."

 kns_is_squire_or_prev_squire:0 "Is not already a [squire|E] with a knight, or is a knightless squire"
 kns_can_become_a_knight_trigger_age_tt:0 "Is at least 16, or at least 12 with extremely high [prowess|E]"
 kns_knighthood_was_revoked_tt:0 "Previously had knighthood revoked"
 kns_character_to_knight_exists:0 "A [kns_knight|E] who can take a squire is available"
 kns_character_to_squire_exists:0 "An eligible [squire|E] is available"

 KNS_KNIGHTHOOD_HIGH_BOLDNESS_REASON:0 "[personality|E] - #italic I would prove myself as a knight:#! $VALUE|=+0$"
 KNS_KNIGHTHOOD_EDUCATION_MARTIAL_REASON:0 "[education|E]: martial schooling: $VALUE|=+0$"
 KNS_KNIGHTHOOD_EDUCATION_LEARNING_REASON:0 "[education|E]: I am a scholar, not a man-at-arms: $VALUE|=+0$"
 KNS_KNIGHTHOOD_I_AM_A_WARRIOR_REASON:0 "[education|E]: I am already trained at arms: $VALUE|=+0$"
 KNS_KNIGHTHOOD_MY_FAITH_DOES_NOT_CARE:0 "I do not follow a Christian faith: $VALUE|=+0$"
 KNS_KNIGHTHOOD_HAS_KNIGHTHOOD_REASON:0 "I follow a Christian faith: $VALUE|=+0$"
 KNS_LOWBORN_DESIRES_KNIGHTHOOD_REASON:0 "As a [lowborn|E], knighthood would raise me: $VALUE|=+0$"
 KNS_HIGHBORN_DISLIKES_LOWBORN_KNIGHT_OFFER:0 "A [lowborn|E] should not dub me: $VALUE|=+0$"
 KNS_SQUIREHOOD_I_AM_A_RULER_ALREADY:0 "I already rule in my own right: $VALUE|=+0$"
 KNS_SQUIREHOOD_I_AM_OLD_ENOUGH:0 "I am old enough to be a knight already: $VALUE|=+0$"
 KNS_AI_GUARDIAN_SKILL_PROWESS:0 "The knight's [prowess|E]: $VALUE|=+0$"

 kns_became_a_squire_toast.t:0 "Squirehood"
 kns_became_a_squire_toast.tt:0 "I have become the squire of [my_knight.GetName]"
 kns_squire_refused_new_knight_toast:0 "No New Knight"

 kns_interaction.0080.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 kns_interaction.0080.desc:0 "We accept the squiring. A proper knightly upbringing is a gift worth giving."
 kns_interaction.0080.a:0 "Good."
 kns_interaction.0081.opening:0 "[recipient.Custom2('AppropriateGreeting', actor )]"
 kns_interaction.0081.desc:0 "We must decline the proposed squiring. It does not suit our house at present."
 kns_interaction.0081.a:0 "A pity."

 # Squire events
 kns_squire.tt.success:0 "The lesson takes"
 kns_squire.tt.failure:0 "The lesson is wasted"
 kns_squire.desc.success:0 "Sweat and bruises, but the work is honest and the progress is real."
 kns_squire.desc.failure:0 "The day ends with sore hands and little to show for them."

 kns_squire.0001.t:0 "In the Saddle"
 kns_squire.0001.desc:0 "[my_knight.GetName] has me up before dawn and into the saddle. The horse knows I am still learning. So does my knight."
 kns_squire.0001.a:0 "I will keep my seat."

 kns_squire.0002.t:0 "Oil and Mail"
 kns_squire.0002.desc:0 "A knight's harness is a second skin, and a squire's first duty. I spend the afternoon with oil, rags, and [my_knight.GetNamePossessive] armor."
 kns_squire.0002.a:0 "Every link must shine."

 kns_squire.0003.t:0 "Blunted Steel"
 kns_squire.0003.desc:0 "[my_knight.GetName] takes up a waster and bids me do the same. The yard is quiet except for the crack of wood and the sound of my own breathing."
 kns_squire.0003.a:0 "Guard high. Step in."

 kns_squire.0004.t:0 "At the Pel"
 kns_squire.0004.desc:0 "There is no one to watch but the post and the crows. I work the pell until my arms shake."
 kns_squire.0004.a:0 "Again."

 kns_squire.0005.t:0 "A Voice for Men"
 kns_squire.0005.desc:0 "[my_knight.GetName] has me stand before the household and try a speech as if I were calling men to the banner. My voice sounds smaller than I hoped."
 kns_squire.0005.a:0 "I will make them hear me."

 kns_squire.0006.t:0 "Courtesy"
 kns_squire.0006.desc:0 "Knighthood is not only the sword. [my_knight.GetName] drills me in greetings, service at table, and how to speak to a lady without making a fool of myself."
 kns_squire.0006.a:0 "I will remember the forms."

 kns_squire.0007.t:0 "Colors and Names"
 kns_squire.0007.desc:0 "I sit with a book of arms and try to keep the lions, bars, and bends in their proper houses. [my_knight.GetName] will ask me later, and I had better know."
 kns_squire.0007.a:0 "I will learn the shields."

 kns_squire.0008.t:0 "The Yard"
 kns_squire.0008.desc:0 "The training yard is full of pages, men-at-arms, and dust. [my_knight.GetName] watches from the fence while I take my turn in the press."
 kns_squire.0008.a:0 "Keep your feet."

 kns_squire.0400.t:0 "A Day of Training"
 kns_squire.0400.desc:0 "My squire, [my_squire.GetName], stands ready in the yard. I must decide how we spend the day."
 kns_squire.0400.a:0 "We will study the order of battle."
 kns_squire.0400.b:0 "We will practice courtesy and conduct."
 kns_squire.0400.c:0 "We will train at arms."
 kns_squire.0400.d:0 "We will ride."
 kns_squire.0400.good_training.tt:0 "The lesson is likely to go well"
 kns_squire.0400.bad_training.tt:0 "The lesson may go poorly"
 kns_squire.0400.had_a_training_session.t:0 "Training"
 kns_squire.0401_good_strategy.desc:0 "[my_squire.GetName] keeps the companies in [my_squire.GetHerHis] head and answers as a commander should."
 kns_squire.0401_bad_strategy.desc:0 "[my_squire.GetName] loses the thread of the lesson and stares at the dirt."
 kns_squire.0401_good_chivalry.desc:0 "[my_squire.GetName] remembers the forms and speaks as a knight ought."
 kns_squire.0401_bad_chivalry.desc:0 "[my_squire.GetName] fumbles the courtesies and earns a hard look."
 kns_squire.0401_good_arms.desc:0 "[my_squire.GetName] is quick in the bind and does not give ground."
 kns_squire.0401_bad_arms.desc:0 "[my_squire.GetName] is slow, and the waster finds [my_squire.GetHerHis] guard too often."
 kns_squire.0401_good_horse.desc:0 "[my_squire.GetName] sits the horse as if born to it."
 kns_squire.0401_bad_horse.desc:0 "The horse has the better of [my_squire.GetName] today."

 # Knighthood events
 kns_knighthood.0016.t:0 "The Wandering Knight"
 kns_knighthood.0016.desc:0 "A knight errant has been sleeping in my hall. My child, [potential_child_squire.GetName], hangs on every tale of the road and the tourney. On the last morning the knight asks to stay and take the child as a squire."
 kns_knighthood.0016.a:0 "Stay, and take [potential_child_squire.GetHerHim]."
 kns_knighthood.0016.b:0 "No. Ride on."
 kns_knighthood.0016.b.tt:0 "The knight will leave your court."

 kns_knighthood.0017.t:0 "Kin and Squirehood"
 kns_knighthood.0017.desc:0 "My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_squire'))], [potential_squire.GetName], has no knight. I could offer to take [potential_squire.GetHerHim] myself."
 kns_knighthood.0017.a:0 "I will make the offer."
 kns_knighthood.0017.b:0 "Not today."

 kns_knighthood.0018.opening:0 "To [knight_offerer.GetName],"
 kns_knighthood.0018.desc:0 "You are not yet a squire. If you will have me, I will take you into my service and, if you earn it, I will dub you myself."
 kns_knighthood.0018.a:0 "I accept."
 kns_knighthood.0018.b:0 "I must refuse."
 kns_knighthood.0018.b_toast:0 "[potential_squire.GetName] Answers"
 kns_knighthood.0018.b_toast_tt:0 "[potential_squire.GetName] has refused."

 kns_knighthood.0019.opening:0 "To [knight_offerer.GetName],"
 kns_knighthood.0019.desc:0 "I accept. Let us bind our houses by this service."
 kns_knighthood.0019.a:0 "Well said."

 kns_knighthood.0300.t:0 "A Squire's Progress"
 kns_knighthood.0300.desc:0 "My squire, [my_squire.GetName], has come far. I believe it is time [my_squire.GetSheHe] was made a knight."
 kns_knighthood.0300.a:0 "I will dub [my_squire.GetHerHim]."
 kns_knighthood.0300.a.tt:0 "[my_squire.GetName] will be knighted."

 kns_knighthood.0320.t:0 "My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_relation'))|U] Is Knighted"
 kns_knighthood.0320.desc_same_house:0 "Word comes that my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_relation'))], [my_relation.GetTitledFirstName], has been dubbed a knight. House [ROOT.GetCharacter.GetHouse.GetName] can be proud."
 kns_knighthood.0320.desc_not_same_house:0 "Word comes that my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_relation'))], [my_relation.GetTitledFirstName], has been dubbed a knight."
 kns_knighthood.0320.a:0 "Good."

 kns_knighthood.0601.t:0 "Spurs on the Field"
 kns_knighthood.0601.desc:0 "The day is ours. Among those who stood in the line, [soldier_to_be_knighted.GetName] fought as a knight ought. I could dub [soldier_to_be_knighted.GetHerHim] here, with the dead still on the grass."
 kns_knighthood.0601.a:0 "Kneel, and rise a knight."
 kns_knighthood.0601.a.tt:0 "[soldier_to_be_knighted.GetName] will be offered knighthood."
 kns_knighthood.0601.b:0 "Not this one."

 kns_knighthood.0602.t:0 "Dubbed in the Dust"
 kns_knighthood.0602.desc:0 "[side_commander.GetName] stands over me with a drawn sword. The battlefield is a poor chapel, but the words are the same."
 kns_knighthood.0602.a:0 "I rise a knight."
 kns_knighthood.0602.a.tt:0 "You will be made a [kns_knight|E]."

 # Maintenance
 kns_maintenance.0005.t:0 "An Unfit Squire"
 kns_maintenance.0005.desc:0 "[my_squire.GetName] can no longer walk the path of knighthood. The bond must end."
 kns_maintenance.0005.a:0 "So be it."
 kns_maintenance.0005.a.tt:0 "The squire relation will end."

 kns_maintenance.0006.t:0 "No Longer a Squire"
 kns_maintenance.0006.desc:0 "I am no longer fit to serve as a squire. [my_knight.GetName] will have to find another."
 kns_maintenance.0006.a:0 "The road ends here."

 kns_maintenance.0008.t:0 "A Broken Bond"
 kns_maintenance.0008.desc:0 "War or hatred has come between me and my squire, [my_squire.GetName]. The arrangement cannot stand."
 kns_maintenance.0008.a:0 "It is finished."

 kns_maintenance.0009.t:0 "A Broken Bond"
 kns_maintenance.0009.desc:0 "I can no longer squire for [my_knight.GetName]. We are enemies now, or our lieges are."
 kns_maintenance.0009.a:0 "Then I am knightless."

 kns_maintenance.0010.t:0 "My Knight Is Dead"
 kns_maintenance.0010.desc:0 "[dead_knight.GetName] is dead. I am a squire without a master. I must find another knight, or wait and hope."
 kns_maintenance.0010.a:0 "I will seek another knight."
 kns_maintenance.0010.b:0 "I will wait."

 kns_maintenance.0011.t:0 "A Knightless Squire"
 kns_maintenance.0011.desc:0 "[knightless_squire.GetName] has lost [knightless_squire.GetHerHis] knight and asks to enter my service."
 kns_maintenance.0011.a:0 "I will take [knightless_squire.GetHerHim]."
 kns_maintenance.0011.b:0 "I have no place for another squire."
 kns_maintenance.0011.b.tt:0 "[knightless_squire.GetName] remains knightless."

 kns_maintenance.0012.t:0 "Last Words"
 kns_maintenance.0012.desc:0 "[dead_knight.GetName] is dying, or already gone. Before the end, I was told to kneel. If I am ready, I may rise a knight by [dead_knight.GetHerHis] last command."
 kns_maintenance.0012.a:0 "I accept the accolade."
 kns_maintenance.0012.a.tt:0 "If you are eligible, you will be knighted."

 kns_maintenance.0400.t:0 "Too Long a Squire"
 kns_maintenance.0400.desc:0 "Years have passed and I am still a squire. The world has begun to laugh. Either I am dubbed now, or I put the belt away."
 kns_maintenance.0400.a:0 "Enough."

